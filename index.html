    <script>
/* Configurable monthly salary rules for TK employees. */
(function () {
  const FORMULA_PAY_TYPE = 'Индивидуальная окладная формула';
  const SALARY_PAY_TYPE = 'Оклад';

  function dateKey(value) {
    const text = String(value || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
    if (/^\d{2}\.\d{2}\.\d{4}$/.test(text)) return ruToIso(text);
    return '';
  }

  function shiftDateKey(shift) {
    return dateKey(shift?.date);
  }

  function previousDate(value) {
    const parsed = new Date(`${value}T12:00:00`);
    parsed.setDate(parsed.getDate() - 1);
    return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
  }

  function assignmentContains(assignment, date) {
    return assignment.from <= date && (!assignment.to || date <= assignment.to);
  }

  function rateAssignmentFor(personRecord, position, dateValue) {
    const date = dateKey(dateValue);
    if (!date) return null;
    return (personRecord.rateAssignments || [])
      .filter(item => item.position === position && assignmentContains(item, date))
      .sort((a, b) => b.from.localeCompare(a.from))[0] || null;
  }

  function hasRateSchedule(personRecord, position) {
    return (personRecord.rateAssignments || []).some(item => item.position === position);
  }

  function assignmentRate(assignment) {
    if (!assignment) return null;
    if (assignment.payType === 'Почасовая') return Number(assignment.rate) || null;
    if (assignment.payType === SALARY_PAY_TYPE) return Number(assignment.monthlySalary) || null;
    if (assignment.payType === FORMULA_PAY_TYPE) return Number(assignment.salaryOvertimeRate) || null;
    return Number(assignment.rate) || null;
  }

  const rateOfBeforeAssignments = rateOf;
  rateOf = function (shift) {
    if (Number(shift?.rate) > 0) return Number(shift.rate);
    const personRecord = person(shift.personId);
    const assignment = rateAssignmentFor(personRecord, shift.position, shiftDateKey(shift));
    if (assignment) return assignmentRate(assignment);
    if (hasRateSchedule(personRecord, shift.position)) return null;
    return rateOfBeforeAssignments(shift);
  };

  const rateForNewShiftBeforeAssignments = rateForNewShift;
  rateForNewShift = function (personRecord, position, location) {
    const assignment = rateAssignmentFor(personRecord, position, today());
    if (assignment) {
      const rate = assignmentRate(assignment);
      return {
        rate,
        rateReview: assignment.payType === 'Почасовая' ? !(rate > 0) : false
      };
    }
    if (hasRateSchedule(personRecord, position)) {
      return { rate: baseRate(position, location), rateReview: true };
    }
    return rateForNewShiftBeforeAssignments(personRecord, position, location);
  };

  function snapshotExistingShiftRates(personRecord) {
    state.shifts
      .filter(shift => shift.personId === personRecord.id && shift.type !== 'Вызывной' && !(Number(shift.rate) > 0))
      .forEach(shift => {
        const savedRate = rateOf(shift);
        if (savedRate > 0) shift.rate = Number(savedRate);
      });
  }

  function currentAssignmentText(personRecord) {
    const assignments = (personRecord.rateAssignments || [])
      .filter(item => item.position === personRecord.position)
      .sort((a, b) => b.from.localeCompare(a.from));
    if (!assignments.length) return 'Периоды ставок ещё не заданы. Первая запись сохранит текущие смены со старой ставкой.';
    const latest = assignments[0];
    return `Последнее назначение: ${isoToRu(latest.from)}–${latest.to ? isoToRu(latest.to) : 'бессрочно'}, ${money(assignmentRate(latest))}${latest.payType === 'Почасовая' ? '/ч' : ''}.`;
  }

  function buildRateAssignment(personRecord, data) {
    const from = dateKey(data.from);
    const indefinite = !!data.indefinite;
    const to = indefinite ? null : dateKey(data.to);
    if (!from) {
      toast('Укажите дату начала действия ставки');
      return null;
    }
    if (!indefinite && !to) {
      toast('Укажите дату окончания или выберите «Бессрочно»');
      return null;
    }
    if (to && to < from) {
      toast('Дата окончания не может быть раньше даты начала');
      return null;
    }

    const position = personRecord.position;
    const existing = (personRecord.rateAssignments || []).map(item => ({ ...item }));
    const futureOverlap = existing.find(item => {
      if (item.position !== position || item.from === from) return false;
      const endsAfterStart = !item.to || item.to >= from;
      const newEndsAfterExistingStart = !to || to >= item.from;
      return item.from > from && endsAfterStart && newEndsAfterExistingStart;
    });
    if (futureOverlap) {
      toast(`Период пересекается с назначением от ${isoToRu(futureOverlap.from)}`);
      return null;
    }

    snapshotExistingShiftRates(personRecord);
    const samePosition = existing.filter(item => item.position === position);
    if (!samePosition.length && Number(personRecord.rate) > 0) {
      const historicalDates = state.shifts
        .filter(shift => shift.personId === personRecord.id && shift.position === position)
        .map(shiftDateKey)
        .filter(Boolean)
        .sort();
      const legacyFrom = historicalDates[0] || dateKey(today());
      if (legacyFrom < from) {
        existing.push({
          id: nextId(),
          position,
          engagement: employment(personRecord),
          payType: personRecord.payType || 'Почасовая',
          rate: Number(personRecord.rate),
          monthlySalary: Number(personRecord.monthlySalary || 0),
          salaryBase: Number(personRecord.salaryBase || 0),
          salaryNormHours: Number(personRecord.salaryNormHours || 0),
          salaryOvertimeRate: Number(personRecord.salaryOvertimeRate || 0),
          from: legacyFrom,
          to: previousDate(from),
          migrated: true
        });
      }
    }

    const updated = existing
      .filter(item => !(item.position === position && item.from === from))
      .map(item => {
        if (item.position === position && item.from < from && (!item.to || item.to >= from)) {
          return { ...item, to: previousDate(from) };
        }
        return item;
      });

    const assignment = {
      id: nextId(),
      position,
      engagement: data.engagement,
      payType: data.payType,
      rate: Number(data.rate || 0),
      monthlySalary: Number(data.monthlySalary || 0),
      salaryBase: Number(data.salaryBase || 0),
      salaryNormHours: Number(data.payType === SALARY_PAY_TYPE ? data.monthlyNormHours : data.salaryNormHours || 0),
      salaryOvertimeRate: Number(data.salaryOvertimeRate || 0),
      from,
      to,
      indefinite,
      createdAt: new Date().toLocaleString('ru-RU'),
      createdBy: 'Бухгалтер'
    };
    personRecord.rateAssignments = [...updated, assignment].sort((a, b) => a.from.localeCompare(b.from));
    return assignment;
  }

  function applyAssignmentToShifts(personRecord, assignment) {
    state.shifts
      .filter(shift => {
        const date = shiftDateKey(shift);
        return shift.personId === personRecord.id &&
          shift.type !== 'Вызывной' &&
          shift.position === assignment.position &&
          date && assignmentContains(assignment, date);
      })
      .forEach(shift => {
        if (assignment.payType === 'Почасовая') shift.rate = Number(assignment.rate);
        shift.engagement = assignment.engagement;
        shift.rateReview = false;
        if (shift.exit) reconcileShift(shift);
      });
  }

  function isSalaryEmployee(personRecord) {
    return employment(personRecord) === 'ТК' && [FORMULA_PAY_TYPE, SALARY_PAY_TYPE].includes(personRecord.payType);
  }

  function salaryShiftAmount(shift, personRecord = person(shift.personId)) {
    if (!isSalaryEmployee(personRecord) || shift.type === 'Вызывной') return null;
    const shiftKey = shiftDateKey(shift).slice(0, 7);
    const ordered = state.shifts
      .filter(item => item.personId === personRecord.id && item.type !== 'Вызывной' && shiftDateKey(item).startsWith(shiftKey) && hours(item) != null)
      .slice()
      .sort((a, b) => shiftDateKey(a).localeCompare(shiftDateKey(b)) || a.id - b.id);
    const index = ordered.findIndex(item => item.id === shift.id);
    if (index < 0) return 0;
    const norm = Number(personRecord.salaryNormHours || 165);
    const base = Number(personRecord.payType === FORMULA_PAY_TYPE ? personRecord.salaryBase || personRecord.monthlySalary || personRecord.rate || 0 : personRecord.monthlySalary || personRecord.rate || 0);
    const overtimeRate = personRecord.payType === FORMULA_PAY_TYPE ? Number(personRecord.salaryOvertimeRate || 750) : 0;
    const before = ordered.slice(0, index).reduce((sum, item) => sum + (hours(item) || 0), 0);
    const worked = hours(shift) || 0;
    const regularHours = Math.min(worked, Math.max(0, norm - before));
    const overtimeHours = Math.max(0, worked - regularHours);
    return (norm > 0 ? base / norm * regularHours : 0) + overtimeHours * overtimeRate;
  }

  const accruedBeforeSalaryFormula = accrued;
  accrued = function (shift) {
    const calculated = salaryShiftAmount(shift);
    return calculated == null ? accruedBeforeSalaryFormula(shift) : calculated;
  };

  function monthShifts(personId, locationFilter) {
    const monthKey = String(currentPeriodTo || currentPeriodFrom).slice(0, 7);
    return state.shifts.filter(shift => {
      const sameMonth = ruToIso(shift.date).startsWith(`${monthKey}-`);
      const sameLocation = locationFilter === 'Все площадки' || shift.location === locationFilter;
      return shift.personId === personId && shift.type !== 'Вызывной' && sameMonth && sameLocation;
    });
  }

  const personWeekBeforeSalaryFormula = personWeek;
  personWeek = function (personRecord, locationFilter = 'Все площадки') {
    const row = personWeekBeforeSalaryFormula(personRecord, locationFilter);
    if (!isSalaryEmployee(personRecord)) return row;

    const salaryShifts = monthShifts(personRecord.id, locationFilter);
    const currentSalaryShifts = row.shifts.filter(shift => shift.type !== 'Вызывной');
    const salaryErrors = salaryShifts.filter(hasError);
    const monthHours = salaryShifts.reduce((sum, shift) => sum + (hours(shift) || 0), 0);
    const salaryBase = Number(personRecord.payType === FORMULA_PAY_TYPE ? personRecord.salaryBase || personRecord.monthlySalary || personRecord.rate || 0 : personRecord.monthlySalary || personRecord.rate || 0);
    const normHours = Number(personRecord.salaryNormHours || 165);
    const overtimeRate = Number(personRecord.salaryOvertimeRate || 750);
    const overtimeHours = Math.max(0, monthHours - normHours);
    const proportionalHours = Math.min(monthHours, normHours);
    const proportionalBase = normHours > 0 ? salaryBase / normHours * proportionalHours : 0;
    const base = Math.round(proportionalBase + (personRecord.payType === FORMULA_PAY_TYPE ? overtimeHours * overtimeRate : 0));
    // Salary accrues cumulatively for the month, but a payout may only be
    // formed from a calculation period that actually contains this person's
    // shifts. This keeps the cumulative salary formula while preventing an
    // employee from appearing in a later, empty week just because it is the
    // closing period of the month.
    const hasCurrentPeriodShifts = currentSalaryShifts.length > 0;
    const payable = hasCurrentPeriodShifts;
    const monthKey = currentAccountingMonthKey();
    const salaryPenalty = state.adjustments.filter(adjustment => {
      const samePerson = adjustment.personId === personRecord.id;
      const sameType = adjustment.type === 'Штраф';
      const sameMonth = adjustment.date
        ? monthKeyFromRuDate(adjustment.date) === monthKey
        : adjustment.month === periodMonth();
      const sameLocation = locationFilter === 'Все площадки' || adjustment.location === locationFilter;
      return samePerson && sameType && sameMonth && sameLocation;
    }).reduce((sum, adjustment) => sum + Number(adjustment.amount || 0), 0);
    const total = base + row.taxi + row.bonus - salaryPenalty;
    const paid = monthPaid(personRecord.id);

    return {
      ...row,
      ok: hasCurrentPeriodShifts && salaryErrors.length === 0,
      errorShifts: salaryErrors,
      base,
      penalty: salaryPenalty,
      total,
      paid,
      balance: total - paid,
      salaryBase,
      salaryNormHours: normHours,
      salaryOvertimeRate: overtimeRate,
      salaryMonthHours: monthHours,
      salaryOvertimeHours: overtimeHours,
      salaryHourlyValue: normHours > 0 ? salaryBase / normHours : 0,
      salaryUnderNorm: monthHours < normHours,
      salaryMissingHours: Math.max(0, normHours - monthHours),
      salaryIncluded: hasCurrentPeriodShifts,
      salaryPayable: payable
    };
  };

  window.salaryRateLabel = function (personRecord) {
    if (employment(personRecord) !== 'ТК') return null;

    if (personRecord.payType === FORMULA_PAY_TYPE) {
      const base = Number(personRecord.salaryBase || 123000);
      const norm = Number(personRecord.salaryNormHours || 165);
      const overtime = Number(personRecord.salaryOvertimeRate || 750);
      const hourly = norm > 0 ? base / norm : 0;
      return `<b>${money(base)}</b><div class="subline salary-rate-note">${money(hourly)}/ч до ${norm} ч · сверх +${money(overtime)}/ч</div>`;
    }

    if (personRecord.payType === SALARY_PAY_TYPE) {
      const base = Number(personRecord.monthlySalary || personRecord.rate || 0);
      const norm = Number(personRecord.salaryNormHours || 165);
      const hourly = norm > 0 ? base / norm : 0;
      return `<b>${money(base)}</b><div class="subline salary-rate-note">${money(hourly)}/ч · норма ${norm} ч</div>`;
    }

    return null;
  };

  const rowStatusBeforeSalaryFormula = rowStatus;
  rowStatus = function (row) {
    if (isSalaryEmployee(row.p) && !row.salaryPayable) return status('Нет смен в выбранном периоде', 'warn');
    if (isSalaryEmployee(row.p) && row.salaryUnderNorm) return status(`Начислено ${row.salaryMonthHours.toLocaleString('ru-RU')} из ${row.salaryNormHours} ч`, 'warn');
    return rowStatusBeforeSalaryFormula(row);
  };

  const openRegistersBeforeSalaryFormula = openRegistersModal;
  openRegistersModal = function () {
    const weekRowsBeforeRegistry = weekRows;
    weekRows = function () {
      return weekRowsBeforeRegistry().map(row => row.salaryPayable === false ? { ...row, ok: false } : row);
    };
    try {
      return openRegistersBeforeSalaryFormula();
    } finally {
      weekRows = weekRowsBeforeRegistry;
    }
  };

  function salaryField(label, name, value, note = '') {
    return `<label class="field">${label}<div class="salary-input"><input data-field="${name}" type="number" min="0" step="1" value="${value}"><span>${note}</span></div></label>`;
  }

  function updateSalaryFields(modal) {
    const engagement = modal.querySelector('[data-field="engagement"]')?.value;
    const payType = modal.querySelector('[data-field="payType"]')?.value;
    const hourly = modal.querySelector('[data-hourly-rate]');
    const regularSalary = modal.querySelector('[data-regular-salary]');
    const formula = modal.querySelector('[data-salary-formula]');
    const formulaOption = modal.querySelector('[data-field="payType"] option[value="' + FORMULA_PAY_TYPE + '"]');

    if (formulaOption) formulaOption.disabled = engagement !== 'ТК';
    if (engagement !== 'ТК' && payType === FORMULA_PAY_TYPE) {
      modal.querySelector('[data-field="payType"]').value = 'Почасовая';
    }

    const activeType = modal.querySelector('[data-field="payType"]')?.value;
    hourly?.classList.toggle('hidden', activeType !== 'Почасовая');
    regularSalary?.classList.toggle('hidden', activeType !== SALARY_PAY_TYPE);
    formula?.classList.toggle('hidden', activeType !== FORMULA_PAY_TYPE);
    modal.classList.toggle('salary-wide-layout', [SALARY_PAY_TYPE, FORMULA_PAY_TYPE].includes(activeType));
  }

  function openSalarySettings(personRecord, onSaved = null) {
    const chefRate = personRecord.type === 'Вызывной' && employment(personRecord) === 'Наличные';
    const currentPayType = [FORMULA_PAY_TYPE, SALARY_PAY_TYPE, 'Почасовая'].includes(personRecord.payType)
      ? personRecord.payType
      : 'Почасовая';
    const salaryBase = Number(personRecord.salaryBase || 123000);
    const normHours = Number(personRecord.salaryNormHours || 165);
    const overtimeRate = Number(personRecord.salaryOvertimeRate || 750);
    const monthlySalary = Number(personRecord.monthlySalary || personRecord.rate || 0);
    const validityBlock = `<section class="rate-validity" data-rate-validity>
        <div class="rate-validity-head"><b>Период действия ставки</b><span>Для должности «${personRecord.position}»</span></div>
        ${field('Действует с', 'from', today())}
        ${field('Действует до', 'to', '')}
        <label class="check-field rate-indefinite"><input data-field="indefinite" type="checkbox" checked><span><b>Бессрочно</b><small>Ставка действует, пока не появится новое назначение</small></span></label>
        <div class="rate-validity-note">${currentAssignmentText(personRecord)}<br>Смены до начала периода сохранят прежнюю ставку.</div>
      </section>`;

    openModal(
      'Оформление и ставка',
      field('Сотрудник', 'display', personRecord.name) +
      selectField('Оформление', 'engagement', options(['Наличные', 'СЗ', 'ТК'], employment(personRecord))) +
      selectField('Тип оплаты', 'payType', options(['Почасовая', SALARY_PAY_TYPE, FORMULA_PAY_TYPE], currentPayType)) +
      `<label class="field ${currentPayType === 'Почасовая' ? '' : 'hidden'}" data-hourly-rate>Ставка за час<div class="salary-input"><input data-field="rate" type="number" min="0" step="1" value="${personRecord.rate || ''}"><span>₽/ч</span></div></label>` +
      `<section class="salary-config full ${currentPayType === SALARY_PAY_TYPE ? '' : 'hidden'}" data-regular-salary>
        <div class="salary-config-head"><b>Ежемесячный оклад</b><span>Растёт по закрытым сменам и выплачивается в периоде работы</span></div>
        <div class="salary-config-grid">
          ${salaryField('Оклад за месяц', 'monthlySalary', monthlySalary || 123000, '₽')}
          ${salaryField('Норма часов', 'monthlyNormHours', normHours, 'ч')}
        </div>
        <div class="salary-formula-preview">До нормы: оклад ÷ <b data-regular-norm>${normHours}</b> × отработанные часы. Сверх нормы доплата не начисляется.</div>
      </section>` +
      `<section class="salary-config full ${currentPayType === FORMULA_PAY_TYPE ? '' : 'hidden'}" data-salary-formula>
        <div class="salary-config-head"><b>Индивидуальная окладная формула</b><span>Значения можно менять для каждого сотрудника</span></div>
        <div class="salary-config-grid">
          ${salaryField('Оклад', 'salaryBase', salaryBase, '₽')}
          ${salaryField('Норма часов', 'salaryNormHours', normHours, 'ч')}
          ${salaryField('Переработка', 'salaryOvertimeRate', overtimeRate, '₽/ч')}
        </div>
        <div class="salary-formula-preview">До <b data-formula-norm>${normHours}</b> ч: <b data-formula-base>${money(salaryBase)}</b> ÷ <b data-formula-norm>${normHours}</b> × фактические часы. Сверх нормы: полный оклад + переработка × <b data-formula-overtime>${money(overtimeRate)}</b>.</div>
        <div class="salary-period-note">Начисление растёт после каждой закрытой смены. Ведомость формируется только за выбранный период, в котором у сотрудника есть смена; выплаты месяца автоматически вычитаются из остатка.</div>
      </section>` +
      (chefRate ? '<div class="field full rate-hint">Для наличного вызывного ставку устанавливает шеф отдельно в каждой закрытой смене.</div>' : '') +
      validityBlock,
      'Сохранить условия',
      data => {
        const selectedType = data.payType;
        if (selectedType === FORMULA_PAY_TYPE && data.engagement !== 'ТК') {
          toast('Индивидуальная окладная формула доступна только для ТК');
          return false;
        }
        if (selectedType === 'Почасовая' && !chefRate && !(Number(data.rate) > 0)) {
          toast('Введите ставку за час');
          return false;
        }
        if (selectedType === SALARY_PAY_TYPE && (!(Number(data.monthlySalary) > 0) || !(Number(data.monthlyNormHours) > 0))) {
          toast('Введите оклад за месяц и норму часов');
          return false;
        }
        if (selectedType === FORMULA_PAY_TYPE && (!(Number(data.salaryBase) > 0) || !(Number(data.salaryNormHours) > 0) || !(Number(data.salaryOvertimeRate) > 0))) {
          toast('Заполните оклад, норму часов и ставку переработки');
          return false;
        }

        const assignment = buildRateAssignment(personRecord, data);
        if (!assignment) return false;

        const todayKey = dateKey(today());
        if (assignmentContains(assignment, todayKey)) {
          personRecord.engagement = data.engagement;
          personRecord.payType = selectedType;
          if (selectedType === 'Почасовая' && !chefRate) personRecord.rate = Number(data.rate);
          if (selectedType === SALARY_PAY_TYPE) {
            personRecord.monthlySalary = Number(data.monthlySalary);
            personRecord.salaryNormHours = Number(data.monthlyNormHours);
            personRecord.rate = Number(data.monthlySalary);
          }
          if (selectedType === FORMULA_PAY_TYPE) {
            personRecord.salaryBase = Number(data.salaryBase);
            personRecord.salaryNormHours = Number(data.salaryNormHours);
            personRecord.salaryOvertimeRate = Number(data.salaryOvertimeRate);
            personRecord.rate = Number(data.salaryOvertimeRate);
          }
          personRecord.rateConfirmed = true;
          personRecord.ratePosition = personRecord.position;
          personRecord.rateConfirmedAt = new Date().toLocaleString('ru-RU');
          personRecord.rateConfirmedBy = 'Бухгалтер';
        }

        applyAssignmentToShifts(personRecord, assignment);
        const conditions = selectedType === FORMULA_PAY_TYPE
          ? `${money(assignment.salaryBase)} до ${assignment.salaryNormHours} ч, переработка ${money(assignment.salaryOvertimeRate)}/ч`
          : selectedType === SALARY_PAY_TYPE
            ? `${money(assignment.monthlySalary)} в месяц, норма ${assignment.salaryNormHours} ч`
            : `${money(assignment.rate)}/ч`;
        const validity = `${isoToRu(assignment.from)}–${assignment.to ? isoToRu(assignment.to) : 'бессрочно'}`;
        state.audit.unshift({
          at: new Date().toLocaleString('ru-RU'),
          actor: 'Бухгалтер',
          text: `Для ${personRecord.name} назначены условия: ${personRecord.position} · ${data.engagement} · ${selectedType} · ${conditions} · период ${validity}`
        });
        if (typeof onSaved === 'function') onSaved({ assignment, data, personRecord });
      }
    );

    const modal = document.querySelector('#modal');
    modal.classList.add('salary-settings-modal');
    modal.querySelector('[data-field="display"]')?.closest('.field')?.classList.add('salary-employee-field');
    modal.querySelector('[data-field="engagement"]')?.closest('.field')?.classList.add('salary-engagement-field');
    modal.querySelector('[data-field="payType"]')?.closest('.field')?.classList.add('salary-paytype-field');
    const modalActions = modal.querySelector('.modal-actions');
    modalActions?.insertAdjacentHTML('afterbegin', '<button class="salary-reset-btn" type="button" data-reset-salary>↻&nbsp;&nbsp;Сбросить</button>');
    const engagementSelect = modal.querySelector('[data-field="engagement"]');
    const payTypeSelect = modal.querySelector('[data-field="payType"]');
    const updatePreview = () => {
      const base = Number(modal.querySelector('[data-field="salaryBase"]')?.value || 0);
      const norm = Number(modal.querySelector('[data-field="salaryNormHours"]')?.value || 0);
      const regularNorm = Number(modal.querySelector('[data-field="monthlyNormHours"]')?.value || 0);
      const overtime = Number(modal.querySelector('[data-field="salaryOvertimeRate"]')?.value || 0);
      const baseNode = modal.querySelector('[data-formula-base]');
      const normNodes = modal.querySelectorAll('[data-formula-norm]');
      const regularNormNode = modal.querySelector('[data-regular-norm]');
      const overtimeNode = modal.querySelector('[data-formula-overtime]');
      if (baseNode) baseNode.textContent = money(base);
      normNodes.forEach(node => node.textContent = norm.toLocaleString('ru-RU'));
      if (regularNormNode) regularNormNode.textContent = regularNorm.toLocaleString('ru-RU');
      if (overtimeNode) overtimeNode.textContent = money(overtime);
    };
    engagementSelect.onchange = () => updateSalaryFields(modal);
    payTypeSelect.onchange = () => updateSalaryFields(modal);
    const indefiniteInput = modal.querySelector('[data-field="indefinite"]');
    const toInput = modal.querySelector('[data-field="to"]');
    const toField = toInput?.closest('.field');
    const updateValidity = () => {
      const indefinite = !!indefiniteInput?.checked;
      if (toInput) {
        toInput.disabled = indefinite;
        if (indefinite) toInput.value = '';
      }
      toField?.classList.toggle('disabled', indefinite);
      toField?.querySelector('[data-date-picker]')?.toggleAttribute('disabled', indefinite);
    };
    if (indefiniteInput) indefiniteInput.onchange = updateValidity;
    modal.querySelectorAll('[data-salary-formula] input,[data-regular-salary] input').forEach(input => input.oninput = updatePreview);
    modal.querySelector('[data-reset-salary]').onclick = () => {
      const defaults = { salaryBase: 123000, salaryNormHours: 165, salaryOvertimeRate: 750 };
      Object.entries(defaults).forEach(([name, value]) => {
        const input = modal.querySelector(`[data-field="${name}"]`);
        if (input) input.value = value;
      });
      updatePreview();
    };
    updateSalaryFields(modal);
    updateValidity();
  }

  window.openSalarySettings = openSalarySettings;

  const openModalBeforeSalaryLayout = openModal;
  openModal = function (...args) {
    const modal = document.querySelector('#modal');
    modal.classList.remove('salary-settings-modal', 'salary-wide-layout');
    return openModalBeforeSalaryLayout(...args);
  };

  const bindActionBeforeSalaryFormula = bindAction;
  bindAction = function (element) {
    if (element.dataset.action !== 'edit-rate') {
      bindActionBeforeSalaryFormula(element);
      return;
    }
    element.onclick = () => {
      const personRecord = person(Number(element.dataset.id));
      if (!document.querySelector('#drawer').classList.contains('hidden')) closeDrawer();
      openSalarySettings(personRecord);
    };
  };

  const openPersonDrawerBeforeSalaryFormula = openPersonDrawer;
  openPersonDrawer = function (id) {
    openPersonDrawerBeforeSalaryFormula(id);
    const personRecord = person(id);
    if (!isSalaryEmployee(personRecord)) return;

    const drawer = document.querySelector('#drawer');
    const row = personWeek(personRecord);
    const terms = drawer.querySelector('.current-terms');
    if (terms) {
      const details = personRecord.payType === FORMULA_PAY_TYPE
        ? `<div class="drawer-salary-formula"><span><small>Оклад</small><b>${money(row.salaryBase)}</b></span><span><small>Норма</small><b>${row.salaryNormHours} ч</b></span><span><small>Переработка</small><b>${money(row.salaryOvertimeRate)}/ч</b></span><span><small>Часы за месяц</small><b>${row.salaryMonthHours.toLocaleString('ru-RU')} ч</b></span></div>`
        : `<div class="drawer-salary-formula"><span><small>Оклад за месяц</small><b>${money(row.salaryBase)}</b></span><span><small>Начисление</small><b>${row.salaryIncluded ? 'Включено в период' : 'В конце месяца'}</b></span></div>`;
      terms.insertAdjacentHTML('afterend', details);
      const rateTitle = terms.querySelector('span:last-child small');
      const rateValue = terms.querySelector('span:last-child b');
      if (rateTitle) rateTitle.textContent = 'Тип оплаты';
      if (rateValue) rateValue.textContent = personRecord.payType === FORMULA_PAY_TYPE ? 'Индивидуальный оклад' : 'Оклад';
    }
    drawer.querySelectorAll('.person-shift-card .shift-money b').forEach(value => value.textContent = 'В окладе');
  };

  render();
})();

    </script>
    <script>
(function () {
  const oldCloseDrawer = closeDrawer;

  function icon(name) {
    const paths = {
      wallet: '<path d="M4 7h16v12H4zM4 7l11-3v3M15 11h5v4h-5z"/>',
      calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
      coins: '<ellipse cx="9" cy="7" rx="5" ry="2.5"/><path d="M4 7v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V7M4 11v4c0 1.4 2.2 2.5 5 2.5 1.1 0 2.2-.2 3-.5M15 11c2.8 0 5 1.1 5 2.5S17.8 16 15 16s-5-1.1-5-2.5S12.2 11 15 11Zm-5 2.5v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4"/>',
      document: '<path d="M7 3h7l4 4v14H7zM14 3v5h5M10 12h5M10 16h5"/>',
      alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      gift: '<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3 9h18M12 9v11M12 9H8.5A2.5 2.5 0 1 1 11 6.5Zm0 0h3.5A2.5 2.5 0 1 0 13 6.5Z"/>',
      car: '<path d="M5 16h14l-1.5-6h-11zM7 10l2-4h6l2 4M6 16v3M18 16v3"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/>',
      minus: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
      work: '<path d="M4 8h16v11H4zM9 8V5h6v3M4 12h16M10 12v2h4v-2"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/>'
    };
    return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.document}</svg>`;
  }

  function signedMoney(value) {
    const number = Number(value || 0);
    return `${number > 0 ? '+' : number < 0 ? '−' : ''}${money(Math.abs(number))}`;
  }

  function shiftWord(count) {
    if (count % 10 === 1 && count % 100 !== 11) return 'смена';
    if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) return 'смены';
    return 'смен';
  }

  function amountRows(row) {
    const period = currentPeriod;
    const taxi = Number(row.taxi || 0);
    const adjustmentRows = row.monthlyAdjustments.map(item => ({
      icon: item.type === 'Анимация' || item.type === 'Премия' ? 'gift' : 'document',
      title: item.type,
      period: `${item.month}${item.location ? ` · ${item.location}` : ''}`,
      status: 'Начислено',
      tone: 'good',
      amount: Number(item.amount || 0)
    }));
    const penaltyRows = state.adjustments.filter(item => item.personId === row.p.id && item.type === 'Штраф' && (!item.date || inCurrentPeriod(item.date))).map(item => ({
      icon: 'minus',
      title: 'Штраф',
      period: `${item.date || period}${item.location ? ` · ${item.location}` : ''}`,
      status: 'Удержано',
      tone: 'negative',
      amount: -Number(item.amount || 0)
    }));
    return [
      { icon: 'work', title: 'Труд по сменам', period, status: row.base ? 'Начислено' : 'Нет начислений', tone: row.base ? 'good' : 'muted', amount: Number(row.base || 0) },
      ...adjustmentRows,
      { icon: 'car', title: 'Такси', period: taxi ? period : '—', status: taxi ? 'Учтено' : 'Нет начислений', tone: taxi ? 'good' : 'muted', amount: taxi },
      ...(penaltyRows.length ? penaltyRows : [{ icon: 'minus', title: 'Штрафы', period: '—', status: 'Нет удержаний', tone: 'muted', amount: 0 }])
    ];
  }

  function conditionsMarkup(personRecord) {
    const payType = personRecord.payType || 'Почасовая';
    let rate = personRecord.rate ? `${money(personRecord.rate)}/ч` : 'Не указана';
    let extra = '';
    if (personRecord.payType === 'Индивидуальная окладная формула') {
      rate = money(personRecord.salaryBase || 123000);
      extra = `<div><span>Норма часов</span><b>${Number(personRecord.salaryNormHours || 165).toLocaleString('ru-RU')} ч</b></div><div><span>Переработка</span><b>${money(personRecord.salaryOvertimeRate || 750)}/ч</b></div>`;
    } else if (personRecord.payType === 'Оклад') {
      rate = `${money(personRecord.monthlySalary || personRecord.rate || 0)} в месяц`;
      extra = `<div><span>Норма часов</span><b>${Number(personRecord.salaryNormHours || 165).toLocaleString('ru-RU')} ч</b></div>`;
    }
    return `<div class="finance-conditions-grid"><div><span>Оформление</span><b>${employment(personRecord)}</b></div><div><span>Тип сотрудника</span><b>${personRecord.type}</b></div><div><span>Тип оплаты</span><b>${payType}</b></div><div><span>Ставка</span><b>${rate}</b></div>${extra}</div>`;
  }

  function historyMarkup(history) {
    if (!history.length) return '<div class="finance-empty">Изменений пока нет</div>';
    return `<div class="finance-history-list">${history.map(item => `<article><span class="history-dot"></span><div><time>${item.at}</time><b>${item.text}</b><small>${item.actor}</small></div></article>`).join('')}</div>`;
  }

  function openFinancialPersonCard(id) {
    const personRecord = person(id);
    const row = personWeek(personRecord);
    const drawer = document.querySelector('#drawer');
    const totalHours = row.shifts.reduce((sum, shift) => sum + (hours(shift) || 0), 0);
    const bonuses = Number(row.bonus || 0);
    const corrections = Number(row.taxi || 0) - Number(row.penalty || 0);
    const balance = Number(row.balance || 0);
    const hasIssues = row.errorShifts.length > 0;
    const salaryPending = row.salaryPayable === false;
    const headerStatus = hasIssues ? 'Требует проверки' : salaryPending ? 'Оклад накапливается' : balance > 0 ? 'К выплате' : 'Расчёт закрыт';
    const headerTone = hasIssues ? 'bad' : balance > 0 ? 'warn' : 'good';
    const balanceLabel = balance < 0 ? 'Переплата' : balance > 0 ? 'К выплате' : 'Остаток';
    const balanceValue = money(Math.abs(balance));
    const paymentDisabled = hasIssues || salaryPending || balance <= 0;
    const paymentHint = hasIssues ? 'Сначала исправьте ошибки в сменах' : salaryPending ? 'Оклад накапливается и будет доступен к выплате в конце месяца' : balance < 0 ? 'Новая выплата недоступна: есть переплата' : 'Расчёт уже закрыт';
    const history = state.audit.filter(item => item.text.includes(personRecord.name));
    const latest = history[0];
    const rows = amountRows(row);

    drawer.classList.remove('security-person-drawer');
    drawer.classList.add('person-drawer', 'person-finance-drawer');
    drawer.innerHTML = `
      <header class="finance-card-head">
        <div>
          <div class="eyebrow">Карточка сотрудника</div>
          <h2>${personRecord.name}</h2>
          <div class="person-identity"><span>${personRecord.position}</span><span>${personRecord.type}</span><span>${employment(personRecord)}</span></div>
          <span class="finance-period">${icon('calendar')}<b>${currentPeriod}</b></span>
        </div>
        <div class="finance-head-actions">${status(headerStatus, headerTone)}<button class="icon-btn" data-close-drawer aria-label="Закрыть">×</button></div>
      </header>

      <section class="finance-summary" aria-label="Финансовое резюме">
        <article>${icon('wallet')}<span>Начислено</span><b>${money(row.total)}</b></article>
        <article>${icon('calendar')}<span>Премии и анимации</span><b>${money(bonuses)}</b></article>
        <article>${icon('coins')}<span>Выплачено</span><b>${money(row.paid)}</b></article>
        <article>${icon('document')}<span>Корректировки</span><b class="${corrections < 0 ? 'negative' : corrections > 0 ? 'positive' : ''}">${signedMoney(corrections)}</b></article>
        <article class="finance-balance ${balance < 0 ? 'overpaid' : balance > 0 ? 'due' : 'closed'}">${icon(balance < 0 ? 'alert' : 'wallet')}<span>${balanceLabel}</span><b>${balanceValue}</b></article>
        <article class="finance-hours">${icon('clock')}<span>Отработано</span><b>${row.shifts.length} ${shiftWord(row.shifts.length)} · ${totalHours.toLocaleString('ru-RU')} ч</b></article>
      </section>

      <nav class="finance-tabs" role="tablist" aria-label="Разделы карточки сотрудника">
        ${['accruals:Начисления', 'shifts:Смены', 'conditions:Условия', 'history:История'].map((item, index) => { const [key, label] = item.split(':'); return `<button role="tab" aria-selected="${index === 0}" class="${index === 0 ? 'active' : ''}" data-person-card-tab="${key}">${label}</button>`; }).join('')}
      </nav>

      <div class="finance-tab-panels">
        <section class="finance-tab-panel" data-person-card-panel="accruals">
          <div class="finance-section-head"><div><h3>Начисления</h3><p>Все суммы за выбранный расчётный период</p></div><div class="adjustment-actions"><button class="btn small" data-action="person-adjustment" data-type="Премия" data-id="${id}">+ Премия</button><button class="btn small" data-action="person-adjustment" data-type="Анимация" data-id="${id}">+ Анимация</button><button class="btn small danger" data-action="person-adjustment" data-type="Штраф" data-id="${id}">− Штраф</button></div></div>
          <div class="finance-accrual-table" role="table">
            <div class="finance-accrual-head" role="row"><span>Вид начисления</span><span>Период</span><span>Статус</span><span>Сумма</span></div>
            ${rows.map(item => `<div class="finance-accrual-row" role="row"><span class="finance-accrual-name"><i>${icon(item.icon)}</i><b>${item.title}</b></span><span>${item.period}</span><span><em class="finance-row-status ${item.tone}"><i></i>${item.status}</em></span><strong class="${item.amount < 0 ? 'negative' : item.amount > 0 ? 'positive' : ''}">${signedMoney(item.amount)}</strong></div>`).join('')}
          </div>
          <div class="finance-support-grid">
            <article class="finance-support-card"><header><h3>${icon('settings')}Условия оплаты</h3><button data-person-card-tab-jump="conditions">Изменить условия</button></header>${conditionsMarkup(personRecord)}</article>
            <article class="finance-support-card"><header><h3>${icon('clock')}Последние изменения</h3><button data-person-card-tab-jump="history">Вся история →</button></header>${latest ? `<div class="finance-latest"><span class="history-dot"></span><div><time>${latest.at}</time><b>${latest.text}</b><small>${latest.actor}</small></div></div>` : '<div class="finance-empty small">Изменений пока нет</div>'}</article>
          </div>
        </section>

        <section class="finance-tab-panel hidden" data-person-card-panel="shifts">
          <div class="finance-section-head"><div><h3>Смены</h3><p>${row.shifts.length} ${shiftWord(row.shifts.length)} за период · нажмите на строку для подробностей</p></div></div>
          <div class="finance-shift-list">${row.shifts.length ? row.shifts.slice().sort((a, b) => b.date.localeCompare(a.date, 'ru')).map(shift => `<button data-person-shift-open="${shift.id}"><span><b>${shift.date}</b><small>${shift.location} · ${shift.position}</small></span><span><b>${window.shiftTimeRangeText ? window.shiftTimeRangeText(shift) : shift.workStart ? `${shift.workStart}–${shift.workEnd}` : `${shift.entry}–${shift.exit || '…'}`}</b><small>${hours(shift) == null ? 'Время не рассчитано' : `${hours(shift).toLocaleString('ru-RU')} ч`}</small></span><span><b>${money(accrued(shift))}</b>${status(shift.status, tone(shift))}</span><i>›</i></button>`).join('') : '<div class="finance-empty">Смен за выбранный период нет</div>'}</div>
        </section>

        <section class="finance-tab-panel hidden" data-person-card-panel="conditions">
          <div class="finance-section-head"><div><h3>Условия оплаты</h3><p>Действующие условия сотрудника</p></div><button class="btn" data-action="edit-rate" data-id="${id}">Изменить условия</button></div>
          ${conditionsMarkup(personRecord)}
          <div class="finance-note">Условия применяются к сменам выбранной должности внутри заданного периода. Смены до начала периода не меняются.</div>
        </section>

        <section class="finance-tab-panel hidden" data-person-card-panel="history">
          <div class="finance-section-head"><div><h3>История изменений</h3><p>Кто, когда и что изменил в карточке сотрудника</p></div></div>
          ${historyMarkup(history)}
        </section>
      </div>

      <footer class="finance-card-actions">
        <button class="btn" data-person-card-close>Закрыть</button>
        <button class="btn" data-action="edit-rate" data-id="${id}">Изменить условия</button>
        <button class="btn primary" data-action="person-payment" data-id="${id}" ${paymentDisabled ? `disabled title="${paymentHint}" aria-label="Зафиксировать выплату. ${paymentHint}"` : ''}>Зафиксировать выплату</button>
      </footer>`;

    showDrawer(drawer);
    drawer.scrollTop = 0;
    drawer.querySelectorAll('[data-person-card-tab], [data-person-card-tab-jump]').forEach(button => button.onclick = () => {
      const tab = button.dataset.personCardTab || button.dataset.personCardTabJump;
      drawer.querySelectorAll('[data-person-card-tab]').forEach(item => {
        const active = item.dataset.personCardTab === tab;
        item.classList.toggle('active', active);
        item.setAttribute('aria-selected', String(active));
      });
      drawer.querySelectorAll('[data-person-card-panel]').forEach(panel => panel.classList.toggle('hidden', panel.dataset.personCardPanel !== tab));
      drawer.scrollTo({ top: Math.max(0, drawer.querySelector('.finance-tabs').offsetTop - 12), behavior: 'smooth' });
    });
    drawer.querySelectorAll('[data-person-card-close]').forEach(button => button.onclick = closeDrawer);
    drawer.querySelectorAll('[data-person-shift-open]').forEach(button => button.onclick = () => {
      drawer.classList.remove('person-finance-drawer');
      openDrawer(Number(button.dataset.personShiftOpen));
    });
  }

  closeDrawer = function () {
    document.querySelector('#drawer').classList.remove('person-finance-drawer');
    oldCloseDrawer();
  };
  openPersonDrawer = openFinancialPersonCard;
})();

    </script>
    <script>
(function () {
  const COUNTRY_CODES = 'RU BY KZ KG TJ UZ AM AZ MD TM GE UA RS TR AF AL DZ AD AO AG AR AU AT BH BD BB BE BZ BJ BT BO BA BW BR BN BG BF BI KH CM CA CV CF TD CL CN CO KM CG CR HR CU CY CZ CD DK DJ DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM DE GH GR GD GT GN GW GY HT HN HU IS IN ID IR IQ IE IL IT CI JM JP JO KE KI KP KR KW LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG MK NO OM PK PW PA PG PY PE PH PL PT QA RO RW KN LC VC WS SM ST SA SN SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TW TZ TH TL TG TO TT TN AE GB US UY VA VE VN YE ZM ZW'.split(' ');
  const REGION_NAMES = typeof Intl !== 'undefined' && Intl.DisplayNames ? new Intl.DisplayNames(['ru'], { type: 'region' }) : null;
  const COUNTRIES = COUNTRY_CODES.map(code => REGION_NAMES ? REGION_NAMES.of(code) : code).filter(Boolean).sort((a, b) => a.localeCompare(b, 'ru'));
  const DOCUMENT_EXAMPLES = {
    'Россия': '45 08 123456',
    'Беларусь': 'AB1234567',
    'Казахстан': 'N12345678',
    'Кыргызстан': 'ID1234567',
    'Киргизия': 'ID1234567',
    'Таджикистан': 'A12345678',
    'Узбекистан': 'AA1234567',
    'Армения': 'AN1234567',
    'Азербайджан': 'C01234567',
    'Молдова': 'B1234567',
    'Туркменистан': 'A12345678',
    'Грузия': '12AB34567',
    'Украина': 'AA123456'
  };

  function escapeIdentity(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
  }

  const COMMON_FIRST_NAMES = new Set(['иван', 'анна', 'дмитрий', 'елена', 'сергей', 'михаил', 'лев', 'татьяна', 'александр', 'алексей', 'мария', 'наталья', 'ольга']);

  function splitIdentityName(values = {}) {
    if (values.lastName != null || values.firstName != null || values.middleName != null) {
      return {
        lastName: String(values.lastName || '').trim(),
        firstName: String(values.firstName || '').trim(),
        middleName: String(values.middleName || '').trim(),
        noMiddleName: !!values.noMiddleName
      };
    }
    const parts = String(values.name || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length >= 3) return { lastName: parts[0], firstName: parts[1], middleName: parts.slice(2).join(' '), noMiddleName: false };
    if (parts.length === 2 && COMMON_FIRST_NAMES.has(parts[0].toLocaleLowerCase('ru-RU'))) return { lastName: parts[1], firstName: parts[0], middleName: '', noMiddleName: false };
    return { lastName: parts[0] || '', firstName: parts[1] || '', middleName: '', noMiddleName: false };
  }

  function composeIdentityName(values = {}) {
    return [values.lastName, values.firstName, values.middleName].map(value => String(value || '').trim()).filter(Boolean).join(' ');
  }

  function countryOptions(selected) {
    const current = selected || 'Россия';
    const countries = COUNTRIES.includes(current) ? COUNTRIES : [current, ...COUNTRIES];
    return countries.map(country => `<option value="${escapeIdentity(country)}"></option>`).join('');
  }

  function canonicalCountry(value) {
    const normalized = String(value || '').trim().toLocaleLowerCase('ru-RU');
    return COUNTRIES.find(country => country.toLocaleLowerCase('ru-RU') === normalized) || '';
  }

  function documentExample(country) {
    const resolved = canonicalCountry(country) || country;
    return DOCUMENT_EXAMPLES[resolved] || 'Например: серия и номер без лишнего текста';
  }

  function normalizeDocument(value) {
    return String(value || '').toLocaleUpperCase('ru-RU').replace(/[^0-9A-ZА-ЯЁ]/g, '').replace(/Ё/g, 'Е');
  }

  function normalizeBirthDate(value) {
    const raw = String(value || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return isoToRu(raw);
    return raw;
  }

  function phoneDigits(value) {
    let digits = String(value || '').replace(/\D/g, '');
    if (digits.startsWith('8')) digits = `7${digits.slice(1)}`;
    if (digits && !digits.startsWith('7')) digits = `7${digits}`;
    return digits.slice(0, 11);
  }

  function formatRussianPhone(value, keepPrefix = true) {
    const digits = phoneDigits(value);
    const local = digits.startsWith('7') ? digits.slice(1) : digits;
    if (!local && !keepPrefix) return '';
    let result = '+7 (';
    result += local.slice(0, 3);
    if (local.length >= 3) result += ') ';
    result += local.slice(3, 6);
    if (local.length > 6) result += `-${local.slice(6, 8)}`;
    if (local.length > 8) result += `-${local.slice(8, 10)}`;
    return result;
  }

  function validBirthDate(value) {
    const match = String(value || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (!match) return false;
    const date = new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]), 12);
    return date.getFullYear() === Number(match[3]) &&
      date.getMonth() === Number(match[2]) - 1 &&
      date.getDate() === Number(match[1]) &&
      Number(match[3]) >= 1900 && date <= new Date();
  }

  function ensureIdentityState() {
    state.personIdentityHistory = state.personIdentityHistory || [];
    state.people.forEach(personRecord => {
      if (personRecord.scudRegistered == null) personRecord.scudRegistered = false;
      if (personRecord.birthDate == null) personRecord.birthDate = '';
    });
  }

  function exactDocumentDuplicate(country, passport, excludeId = null) {
    const normalized = normalizeDocument(passport);
    if (!country || normalized.length < 5) return null;
    return state.people.find(personRecord => personRecord.id !== excludeId && personRecord.citizenship === country && normalizeDocument(personRecord.passport) === normalized) || null;
  }

  function probableDuplicate(values, excludeId = null) {
    const name = normalizedPersonName(values.name);
    const phone = normalizedPhone(values.phone);
    const birthDate = normalizeBirthDate(values.birthDate);
    return state.people.find(personRecord => {
      if (personRecord.id === excludeId) return false;
      const sameName = name && normalizedPersonName(personRecord.name) === name;
      const samePhone = phone.length >= 10 && normalizedPhone(personRecord.phone) === phone;
      const sameBirthDate = birthDate && normalizeBirthDate(personRecord.birthDate) === birthDate;
      return (sameName && sameBirthDate) || (sameName && samePhone) || (samePhone && sameBirthDate);
    }) || null;
  }

  function identityActor() {
    return currentRole === 'Охрана' ? `Охрана · ${currentSecurityLocation}` : currentRole || 'Бухгалтер';
  }

  function addIdentityHistory(personRecord, title, changes, actor = identityActor()) {
    ensureIdentityState();
    const entry = {
      id: nextId(),
      personId: personRecord.id,
      personName: personRecord.name,
      at: new Date().toLocaleString('ru-RU'),
      actor,
      title,
      changes
    };
    state.personIdentityHistory.unshift(entry);
    state.audit.unshift({ at: entry.at, actor, text: `${personRecord.name}: ${title.toLowerCase()} · ${changes.join('; ')}` });
  }

  function identityFields(values = {}) {
    const country = values.citizenship || 'Россия';
    const nameParts = splitIdentityName(values);
    return field('Фамилия', 'lastName', nameParts.lastName) +
      field('Имя', 'firstName', nameParts.firstName) +
      `<div class="field identity-middle-name-field"><div class="identity-field-head"><label for="identity-middle-name">Отчество</label><label class="identity-no-middle"><input data-field="noMiddleName" data-no-middle-name type="checkbox" ${nameParts.noMiddleName ? 'checked' : ''}><span>Нет отчества</span></label></div><input id="identity-middle-name" data-field="middleName" value="${escapeIdentity(nameParts.middleName)}" autocomplete="off" ${nameParts.noMiddleName ? 'disabled placeholder="Отчество отсутствует"' : 'placeholder="Введите отчество"'}><small class="identity-required-hint" data-middle-name-hint>Введите отчество или отметьте «Нет отчества»</small></div>` +
      `<label class="field identity-phone-field">Телефон<input data-field="phone" data-identity-phone value="${escapeIdentity(formatRussianPhone(values.phone || '', true))}" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" maxlength="18"><small>Формат: +7 (999) 999-99-99</small></label>` +
      field('Дата рождения', 'birthDate', values.birthDate || '', 'date') +
      `<label class="field identity-country-field">Гражданство<input data-field="citizenship" data-identity-country value="${escapeIdentity(country)}" list="identity-country-options" placeholder="Начните вводить страну" autocomplete="off"><datalist id="identity-country-options">${countryOptions(country)}</datalist></label>` +
      `<label class="field full identity-document-field">Серия и номер документа<input data-field="passport" data-identity-document value="${escapeIdentity(values.passport || '')}" placeholder="${escapeIdentity(documentExample(country))}" autocomplete="off"></label>` +
      selectField('Должность', 'position', options(KITCHEN_POSITIONS, values.position || KITCHEN_POSITIONS[0]), true) +
      `<div class="identity-check-grid full"><label class="check-field"><input data-field="patent" type="checkbox" ${values.patent ? 'checked' : ''}><span><b>Патент есть</b><small>Необязательное поле</small></span></label><label class="check-field"><input data-field="scudRegistered" type="checkbox" ${values.scudRegistered ? 'checked' : ''}><span><b>Зарегистрирован в СКУД</b><small>Есть пропуск в системе доступа</small></span></label></div>` +
      `<div class="person-duplicate-warning hidden" data-person-duplicate-warning role="alert"><span class="person-duplicate-icon">!</span><span><b data-identity-warning-title>Совпадение данных</b><small data-duplicate-person></small><em data-identity-warning-copy></em></span></div>` +
      `<label class="check-field full identity-different-person hidden" data-different-person><input data-field="differentPerson" type="checkbox"><span><b>Это другой человек</b><small>Подтвердите только после проверки документа</small></span></label>`;
  }

  function attachIdentityMatching(modal, excludeId = null) {
    const countryInput = modal.querySelector('[data-identity-country]');
    const documentInput = modal.querySelector('[data-identity-document]');
    const middleNameInput = modal.querySelector('[data-field="middleName"]');
    const noMiddleNameInput = modal.querySelector('[data-no-middle-name]');
    const phoneInput = modal.querySelector('[data-identity-phone]');
    const confirmButton = modal.querySelector('[data-confirm-modal]');
    const example = modal.querySelector('[data-document-example]');
    const warning = modal.querySelector('[data-person-duplicate-warning]');
    const differentPerson = modal.querySelector('[data-different-person]');
    const tracked = ['lastName', 'firstName', 'middleName', 'phone', 'birthDate', 'citizenship', 'passport'];

    const values = () => Object.fromEntries(tracked.map(name => {
      const value = modal.querySelector(`[data-field="${name}"]`)?.value || '';
      return [name, name === 'citizenship' ? (canonicalCountry(value) || value.trim()) : value];
    }));
    const matchingValues = () => {
      const current = values();
      current.name = composeIdentityName(current);
      return current;
    };
    const refreshExample = () => {
      const sample = documentExample(countryInput.value);
      documentInput.placeholder = sample;
      if (example) example.textContent = `Пример для страны: ${sample}`;
    };
    const check = () => {
      const middleNameReady = !!noMiddleNameInput?.checked || !!middleNameInput?.value.trim();
      modal.querySelector('.identity-middle-name-field')?.classList.toggle('identity-required-missing', !middleNameReady);
      if (confirmButton) {
        confirmButton.disabled = !middleNameReady;
        confirmButton.title = middleNameReady ? '' : 'Введите отчество или отметьте «Нет отчества»';
      }
      const current = matchingValues();
      const exact = exactDocumentDuplicate(current.citizenship, current.passport, excludeId);
      const probable = exact ? null : probableDuplicate(current, excludeId);
      const match = exact || probable;
      warning.classList.toggle('hidden', !match);
      warning.classList.toggle('probable', !!probable);
      differentPerson.classList.toggle('hidden', !probable);
      documentInput.classList.toggle('duplicate-input', !!exact);
      documentInput.setAttribute('aria-invalid', exact ? 'true' : 'false');
      if (match) {
        warning.querySelector('[data-identity-warning-title]').textContent = exact ? 'Документ уже зарегистрирован' : 'Возможно, сотрудник уже есть';
        warning.querySelector('[data-duplicate-person]').textContent = `${match.name} · ${match.phone || 'номер не указан'}${match.birthDate ? ` · ${match.birthDate}` : ''}`;
        warning.querySelector('[data-identity-warning-copy]').textContent = exact ? 'Новая карточка с этим документом создана не будет.' : 'Откройте найденную карточку или подтвердите, что это другой человек.';
      }
      return { exact, probable, current };
    };
    countryInput.addEventListener('input', () => { refreshExample(); check(); });
    countryInput.addEventListener('change', () => {
      const resolved = canonicalCountry(countryInput.value);
      if (resolved) countryInput.value = resolved;
      refreshExample();
      check();
    });
    const syncMiddleName = () => {
      const hasNoMiddleName = !!noMiddleNameInput?.checked;
      if (hasNoMiddleName && middleNameInput) middleNameInput.value = '';
      if (middleNameInput) {
        middleNameInput.disabled = hasNoMiddleName;
        middleNameInput.placeholder = hasNoMiddleName ? 'Отчество отсутствует' : 'Введите отчество';
      }
      modal.querySelector('.identity-middle-name-field')?.classList.toggle('without-middle-name', hasNoMiddleName);
      check();
    };
    noMiddleNameInput?.addEventListener('change', syncMiddleName);
    const syncPhone = () => {
      phoneInput.value = formatRussianPhone(phoneInput.value, true);
      phoneInput.setSelectionRange(phoneInput.value.length, phoneInput.value.length);
      check();
    };
    phoneInput?.addEventListener('input', syncPhone);
    phoneInput?.addEventListener('focus', syncPhone);
    tracked.forEach(name => modal.querySelector(`[data-field="${name}"]`)?.addEventListener('input', check));
    syncMiddleName();
    refreshExample();
    check();
    return check;
  }

  function validateIdentity(values, excludeId, checkMatching) {
    if (!String(values.lastName || '').trim()) { toast('Введите фамилию'); return false; }
    if (!String(values.firstName || '').trim()) { toast('Введите имя'); return false; }
    values.lastName = values.lastName.trim();
    values.firstName = values.firstName.trim();
    values.noMiddleName = !!values.noMiddleName;
    values.middleName = values.noMiddleName ? '' : String(values.middleName || '').trim();
    if (!values.noMiddleName && !values.middleName) { toast('Введите отчество или отметьте «Нет отчества»'); return false; }
    values.name = composeIdentityName(values);
    values.phone = formatRussianPhone(values.phone, true);
    const digits = phoneDigits(values.phone);
    if (digits.length !== 11 || !digits.startsWith('7')) { toast('Введите телефон полностью: +7 (999) 999-99-99'); return false; }
    values.birthDate = normalizeBirthDate(values.birthDate);
    if (!validBirthDate(values.birthDate)) { toast('Введите корректную дату рождения в формате ДД.ММ.ГГГГ'); return false; }
    const resolvedCountry = canonicalCountry(values.citizenship);
    if (!resolvedCountry) { toast('Выберите страну из подсказок'); return false; }

    const result = checkMatching();
    if (result.exact) { toast(`Документ уже принадлежит сотруднику: ${result.exact.name}`); return false; }

  function openIdentityEditor(id) {
    const personRecord = person(id);

    let editorBody;

      editorBody = identityFields({
        lastName: existingName.lastName,

        noMiddleName: existingName.noMiddleName,
        phone: personRecord.phone || '',
        birthDate: personRecord.birthDate || '',
        citizenship: personRecord.citizenship || 'Россия',
        passport: personRecord.passport || '',
        position: personRecord.position || KITCHEN_POSITIONS[0],

      const after = { lastName: values.lastName, firstName: values.firstName, middleName: values.middleName, noMiddleName: !!values.noMiddleName, phone: values.phone.trim(), birthDate: normalizeBirthDate(values.birthDate), citizenship: values.citizenship, passport: values.passport.trim(), position: values.position, patent: !!values.patent, scudRegistered: !!values.scudRegistered };

    if (currentRole === 'Охрана') {

      identityModal.classList.add('security-name-locked');

  function identityHistoryMarkup(records) {
    if (!records.length) return '<div class="identity-history-empty">Изменений данных пока нет</div>';
    return records.map(record => `<article class="identity-history-row"><span class="identity-history-dot"></span><div><header><b>${escapeIdentity(record.personName)}</b><time>${escapeIdentity(record.at)}</time></header><strong>${escapeIdentity(record.title)}</strong><ul>${record.changes.map(change => `<li>${escapeIdentity(change)}</li>`).join('')}</ul><small>${escapeIdentity(record.actor)}</small></div></article>`).join('');

  const baseBindAction = bindAction;

    section.querySelector('.security-data-grid').innerHTML = `<span><small>Телефон</small><b>${escapeIdentity(personRecord.phone || 'Не указан')}</b></span><span><small>Дата рождения</small><b>${escapeIdentity(personRecord.birthDate || 'Не указана')}</b></span><span><small>Гражданство</small><b>${escapeIdentity(personRecord.citizenship || 'Не указано')}</b></span><span><small>СКУД</small><b>${personRecord.scudRegistered ? 'Зарегистрирован' : 'Не зарегистрирован'}</b></span><span class="wide"><small>Серия и номер документа</small><b>${escapeIdentity(personRecord.passport || 'Не указаны')}</b></span>`;
    const records = (state.personIdentityHistory || []).filter(record => record.personId === id).slice(0, 3);
    section.insertAdjacentHTML('afterend', `<section class="drawer-section identity-card-history"><div class="section-heading"><div><h3>Изменения данных</h3><span class="section-caption">Последние действия с карточкой</span></div><button class="btn small" data-action="person-identity-history">Вся история</button></div>${identityHistoryMarkup(records)}</section>`);
    drawer.querySelector('[data-action="edit-person-data"]').onclick = () => openIdentityEditor(id);
    drawer.querySelector('[data-action="person-identity-history"]').onclick = openIdentityHistory;
  };

  const basePersonDrawer = openPersonDrawer;
  openPersonDrawer = function (id) {
    basePersonDrawer(id);

    const drawer = document.querySelector('#drawer');
    const conditions = drawer.querySelector('[data-person-card-panel="conditions"]');

    head.insertAdjacentHTML('afterend', `<div class="finance-identity-grid"><div><span>Дата рождения</span><b>${escapeIdentity(personRecord.birthDate || 'Не указана')}</b></div><div><span>Гражданство</span><b>${escapeIdentity(personRecord.citizenship || 'Не указано')}</b></div><div><span>Документ</span><b>${escapeIdentity(personRecord.passport || 'Не указан')}</b></div><div><span>СКУД</span><b>${personRecord.scudRegistered ? 'Зарегистрирован' : 'Не зарегистрирован'}</b></div></div>`);
    drawer.querySelector('[data-action="edit-person-data"]').onclick = () => openIdentityEditor(id);
  };

  const baseSecurityPage = securityPage;
  securityPage = function () {
    return baseSecurityPage().replace('<button class="btn" data-action="register-person">+ Новый сотрудник</button>', '<button class="btn" data-action="person-identity-history">История данных</button><button class="btn" data-action="register-person">+ Новый сотрудник</button>');
  };

  document.addEventListener('click', event => {

    if (editButton) {
      event.preventDefault();
      event.stopImmediatePropagation();

    if (historyButton) {
      event.preventDefault();
      event.stopImmediatePropagation();
      openIdentityHistory();
    }
  }, true);

  ensureIdentityState();
  save();
  render();
})();

    <script>
/* Calendar dates + ordinary 24-hour time for overnight shifts. */
(function () {
  const hoursBeforeDatedShifts = hours;
  const renderBeforeDatedShifts = render;

  function parseRuDate(value) {
    const match = String(value || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (!match) return null;
    const date = new Date(Date.UTC(Number(match[3]), Number(match[2]) - 1, Number(match[1])));
    if (Number.isNaN(date.getTime()) || date.getUTCFullYear() !== Number(match[3]) || date.getUTCMonth() !== Number(match[2]) - 1 || date.getUTCDate() !== Number(match[1])) return null;
    return date;
  }

  function formatRuDate(date) {
    return `${String(date.getUTCDate()).padStart(2, '0')}.${String(date.getUTCMonth() + 1).padStart(2, '0')}.${date.getUTCFullYear()}`;
  }

  function addDays(value, count) {
    const date = parseRuDate(value);
    if (!date) return value;
    date.setUTCDate(date.getUTCDate() + count);
    return formatRuDate(date);
  }

  function dayNumber(value) {
    const date = parseRuDate(value);
    return date ? Math.floor(date.getTime() / 86400000) : null;
  }

  function dateTimeMinutes(date, time) {
    const day = dayNumber(date);
    const clock = minutes(time);
    return day == null || clock == null ? null : day * 1440 + clock;
  }

  function durationMinutes(entryDate, entryTime, exitDate, exitTime) {
    const start = dateTimeMinutes(entryDate, entryTime);
    const end = dateTimeMinutes(exitDate, exitTime);
    return start == null || end == null ? null : end - start;
  }

  function nowTime() {
    const date = new Date();
    return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  }

  function roundedClock(value) {
    const rounded = Math.round(minutes(value) / 30) * 30;
    return {
      time: `${String(Math.floor((rounded % 1440) / 60)).padStart(2, '0')}:${String(rounded % 60).padStart(2, '0')}`,
      dayOffset: Math.floor(rounded / 1440)
    };
  }

  function dateField(label, name, value, full = false) {
    return `<label class="field plum-date-field ${full ? 'full' : ''}">${label}
      <input data-field="${name}" type="text" value="${value}" data-plum-date data-date-format="ru" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" autocomplete="off">
      <button type="button" class="date-picker-trigger" data-date-picker aria-label="Выбрать дату: ${label}" title="Открыть календарь"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg></button>
    </label>`;
  }

  function timeField(label, name, value) {
    return `<label class="field">${label}<input data-field="${name}" type="time" value="${value}" step="60"></label>`;
  }

  function dateTimeBlock(prefix, title, date, time, editable = true) {
    if (!editable) {
      return `<section class="shift-datetime-summary full">
        <span class="shift-datetime-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3v4M17 3v4M3 10h18"/><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M12 13v4l3 2"/></svg></span>
        <span><small>${title}</small><b>${date}, ${time}</b></span>
      </section>`;
    }
    return `<section class="shift-datetime-group full">
      <div class="shift-datetime-title"><b>${title}</b><span>${prefix === 'entry' ? 'Начало смены' : 'Окончание смены'}</span></div>
      <div class="shift-datetime-inputs">
        ${dateField('Дата', `${prefix}Date`, date)}
        ${timeField('Время', `${prefix}Time`, time)}
      </div>
    </section>`;
  }

  function legacyExitPoint(shift) {
    if (!shift.exit) return { date: today(), time: nowTime() };
    const parts = String(shift.exit).split(':').map(Number);
    if (parts[0] >= 24) {
      return {
        date: addDays(shift.date, Math.floor(parts[0] / 24)),
        time: `${String(parts[0] % 24).padStart(2, '0')}:${String(parts[1] || 0).padStart(2, '0')}`
      };
    }
    const inferredNextDay = minutes(shift.exit) < minutes(shift.entry);
    return { date: shift.exitDate || addDays(shift.date, inferredNextDay ? 1 : 0), time: shift.exit };
  }

  function defaultExitPoint(shift) {
    if (shift.exit) return legacyExitPoint(shift);
    const todayValue = today();
    const exitDate = dayNumber(todayValue) >= dayNumber(shift.date) ? todayValue : shift.date;
    return { date: exitDate, time: nowTime() };
  }

  function applyRoundedTimes(shift) {
    const start = roundedClock(shift.entry);
    const end = roundedClock(shift.exit);
    shift.workStart = start.time;
    shift.workEnd = end.time;
    shift.workStartDate = addDays(shift.date, start.dayOffset);
    shift.workEndDate = addDays(shift.exitDate, end.dayOffset);
  }

  function validateInterval(entryDate, entryTime, exitDate, exitTime) {
    if (!parseRuDate(entryDate) || !parseRuDate(exitDate) || minutes(entryTime) == null || minutes(exitTime) == null) {
      toast('Заполните даты и время прихода и ухода');
      return null;
    }
    const duration = durationMinutes(entryDate, entryTime, exitDate, exitTime);
    if (!(duration > 0)) {
      toast('Уход должен быть позже прихода');
      return null;
    }
    return duration;
  }

  function durationText(value) {
    const totalMinutes = Math.round(value);
    const days = Math.floor(totalMinutes / 1440);
    const remainder = totalMinutes % 1440;
    const hoursValue = Math.floor(remainder / 60);
    const minuteValue = remainder % 60;
    const clock = `${hoursValue} ч${minuteValue ? ` ${minuteValue} мин` : ''}`;
    return days ? `${days} дн. ${clock}` : clock;
  }

  function bindIntervalControls(modal, initialEntryDate) {
    const entryDate = modal.querySelector('[data-field="entryDate"]');
    const entryTime = modal.querySelector('[data-field="entryTime"]');
    const exitDate = modal.querySelector('[data-field="exitDate"]');
    const exitTime = modal.querySelector('[data-field="exitTime"]');
    const output = modal.querySelector('[data-shift-duration]');
    const warning = modal.querySelector('[data-shift-duration-warning]');

    const values = () => ({
      entryDate: entryDate?.value || initialEntryDate,
      entryTime: entryTime?.value || modal.dataset.entryTime,
      exitDate: exitDate?.value,
      exitTime: exitTime?.value
    });
    const update = () => {
      const value = values();
      const duration = durationMinutes(value.entryDate, value.entryTime, value.exitDate, value.exitTime);
      const invalid = duration == null || duration <= 0;
      output.classList.toggle('invalid', invalid);
      output.innerHTML = invalid
        ? '<span>Проверьте дату и время ухода</span><b>Уход должен быть позже прихода</b>'
        : `<span>Продолжительность смены</span><b>${durationText(duration)}</b>`;
      warning.classList.toggle('hidden', invalid || duration <= 1440);
    };

    modal.dataset.entryTime = entryTime?.value || modal.dataset.entryTime;
    [entryDate, entryTime, exitDate, exitTime].filter(Boolean).forEach(input => {
      input.addEventListener('input', update);
      input.addEventListener('change', update);
    });
    modal.querySelectorAll('[data-exit-day]').forEach(button => {
      button.onclick = () => {
        const baseDate = entryDate?.value || initialEntryDate;
        exitDate.value = addDays(baseDate, Number(button.dataset.exitDay));
        exitDate.dispatchEvent(new Event('input', { bubbles: true }));
      };
    });
    update();
  }

  function intervalFooter() {
    return `<div class="shift-day-presets full" role="group" aria-label="Быстрый выбор даты ухода">
        <span>Дата ухода:</span>
        <button type="button" class="btn small" data-exit-day="0">В тот же день</button>
        <button type="button" class="btn small" data-exit-day="1">На следующий день</button>
      </div>
      <div class="shift-duration-card full" data-shift-duration></div>
      <div class="shift-duration-warning full hidden" data-shift-duration-warning>Смена длиннее 24 часов. Проверьте даты перед сохранением.</div>`;
  }

  function openEndShiftModal(shift) {
    const exitPoint = defaultExitPoint(shift);
    openModal(
      'Отметить уход',
      field('Сотрудник', 'display', person(shift.personId).name) +
        dateTimeBlock('entry', 'Приход', shift.date, shift.entry, false) +
        dateTimeBlock('exit', 'Уход', exitPoint.date, exitPoint.time) +
        intervalFooter(),
      'Закрыть смену',
      data => {
        const duration = validateInterval(shift.date, shift.entry, data.exitDate, data.exitTime);
        if (duration == null) return false;
        shift.exitDate = data.exitDate;
        shift.exit = data.exitTime;
        applyRoundedTimes(shift);
        shift.status = shift.type === 'Вызывной' ? 'Ожидает ставку шефа' : shift.rateReview ? 'Требует проверки ставки' : rateOf(shift) ? 'Готово' : 'Нет ставки';
        state.audit.unshift({
          at: `${shift.exitDate} ${shift.exit}`,
          actor: 'Охрана',
          text: `Закрыта смена ${person(shift.personId).name}: ${shift.date} ${shift.entry} — ${shift.exitDate} ${shift.exit}; ${durationText(duration)}`
        });
      }
    );
    const modal = document.querySelector('#modal');
    modal.classList.add('shift-datetime-modal');
    modal.dataset.entryTime = shift.entry;
    bindIntervalControls(modal, shift.date);
  }

  function openCorrectionModal(shift) {
    const exitPoint = legacyExitPoint(shift);
    openModal(
      'Исправить вход и выход',
      dateTimeBlock('entry', 'Приход', shift.date, shift.entry) +
        dateTimeBlock('exit', 'Уход', exitPoint.date, exitPoint.time) +
        intervalFooter() +
        field('Причина исправления', 'reason', shift.correctionReason || '', 'text', true),
      'Сохранить исправление',
      data => {
        const duration = validateInterval(data.entryDate, data.entryTime, data.exitDate, data.exitTime);
        if (duration == null) return false;
        if (!data.reason.trim()) {
          toast('Укажите причину исправления');
          return false;
        }
        shift.date = data.entryDate;
        shift.entry = data.entryTime;
        shift.exitDate = data.exitDate;
        shift.exit = data.exitTime;
        applyRoundedTimes(shift);
        shift.correctionRequested = false;
        shift.correctionReason = '';
        shift.correctionRequestedAt = '';
        reconcileShift(shift);
        state.audit.unshift({
          at: new Date().toLocaleString('ru-RU'),
          actor: `Охрана · ${shift.location}`,
          text: `Исправлена смена ${person(shift.personId).name}: ${shift.date} ${shift.entry} — ${shift.exitDate} ${shift.exit}; ${durationText(duration)}; причина: ${data.reason}`
        });
      }
    );
    const modal = document.querySelector('#modal');
    modal.classList.add('shift-datetime-modal', 'shift-correction-modal');
    bindIntervalControls(modal, shift.date);
  }

  hours = function (shift) {
    if (!shift.workStart || !shift.workEnd) return null;
    const startDate = shift.workStartDate || shift.date;
    const endDate = shift.workEndDate || shift.exitDate;
    if (startDate && endDate) {
      const total = durationMinutes(startDate, shift.workStart, endDate, shift.workEnd);
      return total >= 0 ? total / 60 : null;
    }
    return hoursBeforeDatedShifts(shift);
  };

  window.shiftIntervalText = function (shift, short = false) {
    const exitPoint = legacyExitPoint(shift);
    if (!shift.exit) return `${shift.date}, ${shift.entry} — смена открыта`;
    if (short && exitPoint.date === shift.date) return `${shift.date} · ${shift.entry}–${exitPoint.time}`;
    return `${shift.date}, ${shift.entry} → ${exitPoint.date}, ${exitPoint.time}`;
  };

  window.shiftTimeRangeText = function (shift) {
    const exitPoint = legacyExitPoint(shift);
    if (!shift.exit) return `${shift.entry} — смена открыта`;
    return exitPoint.date === shift.date
      ? `${shift.entry}–${exitPoint.time}`
      : `${shift.entry} → ${exitPoint.date}, ${exitPoint.time}`;
  };

  function decorateRenderedIntervals() {
    document.querySelectorAll('.security-recent-row [data-action="correct-shift"]').forEach(button => {
      const shift = state.shifts.find(item => item.id === Number(button.dataset.id));
      const label = button.closest('.security-recent-row')?.querySelector('small');
      if (shift && label) label.textContent = window.shiftIntervalText(shift, true);
    });
    document.querySelectorAll('.security-open-card [data-action="end-shift"]').forEach(button => {
      const shift = state.shifts.find(item => item.id === Number(button.dataset.id));
      const label = button.closest('.security-open-card')?.querySelector('small');
      if (shift && label) label.textContent = `${shift.position} · приход ${shift.date}, ${shift.entry}`;
    });
    document.querySelectorAll('.security-history-row [data-action="correct-shift"]').forEach(button => {
      const shift = state.shifts.find(item => item.id === Number(button.dataset.id));
      const label = button.closest('.security-history-row')?.querySelector('.security-history-time b');
      if (shift && label) label.textContent = window.shiftTimeRangeText(shift);
    });
  }

  const bindActionBeforeDatedShifts = bindAction;
  bindAction = function (element) {
    const action = element.dataset.action;
    if (!['end-shift', 'correct-shift'].includes(action)) {
      bindActionBeforeDatedShifts(element);
      return;
    }
    element.onclick = () => {
      const shift = state.shifts.find(item => item.id === Number(element.dataset.id));
      if (!shift) return;
      if (action === 'correct-shift' && currentRole === 'Охрана' && shift.location !== currentSecurityLocation) {
        toast('Охрана может исправлять время только на своей площадке');
        return;
      }
      if (action === 'correct-shift' && document.querySelector('#drawer').classList.contains('security-person-drawer')) closeDrawer();
      if (action === 'end-shift') openEndShiftModal(shift);
      else openCorrectionModal(shift);
    };
  };

  render = function () {
    renderBeforeDatedShifts();
    decorateRenderedIntervals();
  };

  render();
})();
