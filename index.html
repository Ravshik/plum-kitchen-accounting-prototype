    <script>
(function financeCommentsModule() {
  let portal;
  let activeTarget;
  let scheduled = false;

  function adjustmentDetails(adjustments) {
    return adjustments.map(item => ({
      heading: [item.date || item.month || 'Период не указан', item.location].filter(Boolean).join(' · '),
      comment: item.reason || item.comment || 'Комментарий не указан',
      amount: Number(item.amount || 0),
      sign: item.type === 'Штраф' ? -1 : 1,
      type: item.type
    }));
  }

  function taxiDetails(personId) {
    const month = currentAccountingMonthKey();
    const shifts = state.shifts
      .filter(shift => shift.personId === personId && monthKeyFromRuDate(shift.date) === month && Number(shift.taxi || 0) > 0)
      .sort((a, b) => a.date.localeCompare(b.date, 'ru'));
    const items = shifts.map(shift => ({
      heading: [shift.date, shift.location].filter(Boolean).join(' · '),
      comment: shift.taxiComment || shift.taxiReason || 'Комментарий не указан',
      amount: Number(shift.taxi || 0),
      sign: 1,
      type: 'Такси'
    }));
    const shiftTotal = items.reduce((sum, item) => sum + item.amount, 0);
    const total = taxiAmount(personId);
    const remainder = Math.max(0, total - shiftTotal);
    if (remainder > .01) {
      const expense = state.taxiExpenses.find(item => item.personId === personId && item.accountingMonth === month);
      items.push({
        heading: expense?.date || expense?.period || periodMonth(),
        comment: expense?.comment || expense?.reason || 'Сумма введена за месяц без разбивки по дням',
        amount: remainder,
        sign: 1,
        type: 'Такси'
      });
    }
    return items;
  }

  function penaltyDetails(personId, locationFilter = 'Все площадки') {
    return adjustmentDetails(state.adjustments.filter(item => item.personId === personId && item.type === 'Штраф' && (!item.date || inCurrentPeriod(item.date)) && (locationFilter === 'Все площадки' || item.location === locationFilter)));
  }

  function setPayload(target, title, items) {
    if (!target) return;
    if (!items.length) {
      target.removeAttribute('data-finance-comment');
      target.classList.remove('finance-comment-target');
      return;
    }
    target.dataset.financeComment = encodeURIComponent(JSON.stringify({ title, items }));
    target.classList.add('finance-comment-target');
    if (!target.hasAttribute('tabindex') && !target.matches('input,button,a')) target.tabIndex = 0;
  }

  function enhanceLedger() {
    document.querySelectorAll('[data-ledger-row]').forEach(rowElement => {
      const personId = Number(rowElement.querySelector('[data-pay-person]')?.dataset.payPerson);
      if (!personId) return;
      const record = person(personId);
      if (!record) return;
      const row = personWeek(record, currentLocation);
      const details = rowElement.querySelectorAll('.amount-detail');
      setPayload(rowElement.querySelector('[data-taxi-person]')?.closest('.inline-money'), 'Такси по дням', taxiDetails(personId));
      setPayload(details[0], 'Премии и анимации', adjustmentDetails(row.monthlyAdjustments));
      setPayload(details[1], 'Штрафы', penaltyDetails(personId, currentLocation));
    });
  }

  function enhancePersonCard() {
    const drawer = document.querySelector('.person-finance-drawer');
    if (!drawer) return;
    const personId = Number(drawer.querySelector('[data-action="person-adjustment"]')?.dataset.id);
    if (!personId) return;
    const record = person(personId);
    if (!record) return;
    const row = personWeek(record);
    const amountRows = [...drawer.querySelectorAll('.finance-accrual-row')];
    let cursor = 1;
    row.monthlyAdjustments.forEach(adjustment => {
      setPayload(amountRows[cursor]?.querySelector('strong'), `${adjustment.type}: комментарий`, adjustmentDetails([adjustment]));
      cursor += 1;
    });
    setPayload(amountRows[cursor]?.querySelector('strong'), 'Такси по дням', taxiDetails(personId));
    cursor += 1;
    const penalties = state.adjustments.filter(item => item.personId === personId && item.type === 'Штраф' && (!item.date || inCurrentPeriod(item.date)));
    penalties.forEach(penalty => {
      setPayload(amountRows[cursor]?.querySelector('strong'), 'Штраф: комментарий', adjustmentDetails([penalty]));
      cursor += 1;
    });
  }

  function enhanceChefRows() {
    document.querySelectorAll('[data-chef-period-total]').forEach(element => {
      const personId = Number(element.dataset.chefPeriodTotal);
      const record = person(personId);
      if (!record) return;
      const row = personWeek(record);
      const items = [
        { heading: 'Труд по сменам', comment: `${row.shifts.length} смен · ${currentPeriod}`, amount: row.base, sign: 1, type: 'Труд' },
        ...taxiDetails(personId),
        ...adjustmentDetails(row.monthlyAdjustments),
        ...penaltyDetails(personId)
      ];
      setPayload(element, 'Итого сотруднику за период', items);
    });
  }

  function enhance() {
    scheduled = false;
    enhanceLedger();
    enhancePersonCard();
    enhanceChefRows();
  }

  function scheduleEnhance() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(enhance);
  }

  function ensurePortal() {
    if (portal) return portal;
    portal = document.createElement('aside');
    portal.className = 'finance-tooltip-portal';
    portal.setAttribute('role', 'tooltip');
    document.body.appendChild(portal);
    return portal;
  }

  function show(target) {
    if (!target?.dataset.financeComment) return;
    activeTarget = target;
    let payload;
    try { payload = JSON.parse(decodeURIComponent(target.dataset.financeComment)); } catch { return; }
    const tooltip = ensurePortal();
    tooltip.replaceChildren();
    const title = document.createElement('h4');
    title.textContent = payload.title;
    tooltip.appendChild(title);
    const list = document.createElement('div');
    list.className = 'finance-tooltip-list';
    let total = 0;
    payload.items.forEach(item => {
      total += Number(item.amount || 0) * Number(item.sign || 1);
      const line = document.createElement('div');
      line.className = 'finance-tooltip-item';
      const copy = document.createElement('div');
      const heading = document.createElement('b');
      heading.textContent = item.heading || item.type || '';
      const comment = document.createElement('span');
      comment.textContent = item.comment || 'Комментарий не указан';
      copy.append(heading, comment);
      const amount = document.createElement('strong');
      amount.textContent = `${Number(item.sign || 1) < 0 ? '−' : '+'}${money(Math.abs(Number(item.amount || 0)))}`;
      line.append(copy, amount);
      list.appendChild(line);
    });
    tooltip.appendChild(list);
    if (payload.items.length > 1) {
      const totalLine = document.createElement('div');
      totalLine.className = 'finance-tooltip-total';
      const label = document.createElement('b');
      label.textContent = 'Итого';
      const value = document.createElement('strong');
      value.textContent = `${total < 0 ? '−' : '+'}${money(Math.abs(total))}`;
      totalLine.append(label, value);
      tooltip.appendChild(totalLine);
    }
    tooltip.style.visibility = 'hidden';
    tooltip.classList.add('visible');
    const targetRect = target.getBoundingClientRect();
    const tooltipRect = tooltip.getBoundingClientRect();
    const left = Math.min(window.innerWidth - tooltipRect.width - 12, Math.max(12, targetRect.left + targetRect.width / 2 - tooltipRect.width / 2));
    const above = targetRect.top - tooltipRect.height - 10;
    const top = above >= 12 ? above : Math.min(window.innerHeight - tooltipRect.height - 12, targetRect.bottom + 10);
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${Math.max(12, top)}px`;
    tooltip.style.visibility = 'visible';
  }

  function hide(target) {
    if (target && target !== activeTarget) return;
    activeTarget = null;
    portal?.classList.remove('visible');
  }

  const originalChefPage = chefPage;
  chefPage = function chefPageWithAccountingTotals() {
    const template = document.createElement('template');
    template.innerHTML = originalChefPage();
    const panels = [...template.content.querySelectorAll('.panel')];
    const panel = panels.find(item => item.querySelector('.section-title')?.textContent.includes('Смены, закрытые охраной'));
    const table = panel?.querySelector('table');
    if (!table) return template.innerHTML;
    const head = table.querySelector('thead tr');
    const headerCells = head.querySelectorAll('th');
    if (headerCells[6]) headerCells[6].textContent = 'Труд за смену';
    const correctionHead = document.createElement('th');
    correctionHead.textContent = 'Корректировки';
    const totalHead = document.createElement('th');
    totalHead.textContent = 'Итого за период';
    headerCells[6]?.after(correctionHead, totalHead);
    const closed = state.shifts.filter(shift => shift.exit);
    table.querySelectorAll('tbody tr').forEach((tr, index) => {
      const shift = closed[index];
      if (!shift) return;
      const row = personWeek(person(shift.personId));
      const corrections = Number(row.taxi || 0) + Number(row.bonus || 0) - Number(row.penalty || 0);
      const correctionCell = document.createElement('td');
      correctionCell.innerHTML = `<b class="${corrections < 0 ? 'negative' : corrections > 0 ? 'positive' : ''}">${corrections > 0 ? '+' : corrections < 0 ? '−' : ''}${money(Math.abs(corrections))}</b>`;
      const totalCell = document.createElement('td');
      totalCell.innerHTML = `<b data-chef-period-total="${shift.personId}">${money(row.total)}</b>`;
      tr.children[6]?.after(correctionCell, totalCell);
    });
    return template.innerHTML;
  };

  const originalChefCalloutModal = openChefCalloutModal;
  openChefCalloutModal = function chefCalloutWithTaxiComment(shift, action) {
    originalChefCalloutModal(shift, action);
    const modal = document.querySelector('#modal');
    const taxiInput = modal.querySelector('[data-field="taxi"]');
    if (!taxiInput) return;
    const fieldElement = document.createElement('label');
    fieldElement.className = 'field';
    fieldElement.textContent = 'Комментарий к такси';
    const commentInput = document.createElement('input');
    commentInput.type = 'text';
    commentInput.value = shift.taxiComment || '';
    commentInput.placeholder = 'Например: после позднего окончания смены';
    fieldElement.appendChild(commentInput);
    taxiInput.closest('.field')?.after(fieldElement);
    const confirm = modal.querySelector('[data-confirm-modal]');
    const originalConfirm = confirm.onclick;
    confirm.onclick = () => {
      const previous = shift.taxiComment || '';
      shift.taxiComment = commentInput.value.trim();
      originalConfirm();
      if (!modal.classList.contains('hidden')) shift.taxiComment = previous;
    };
  };

  document.addEventListener('pointerover', event => {
    const target = event.target.closest('[data-finance-comment]');
    if (target && !target.contains(event.relatedTarget)) show(target);
  });
  document.addEventListener('pointerout', event => {
    const target = event.target.closest('[data-finance-comment]');
    if (target && !target.contains(event.relatedTarget)) hide(target);
  });
  document.addEventListener('focusin', event => show(event.target.closest('[data-finance-comment]')));
  document.addEventListener('focusout', event => hide(event.target.closest('[data-finance-comment]')));
  window.addEventListener('scroll', () => hide(), true);
  window.addEventListener('resize', () => hide());

  const observer = new MutationObserver(scheduleEnhance);
  observer.observe(document.querySelector('#page-root'), { childList: true, subtree: true });
  observer.observe(document.querySelector('#drawer'), { childList: true, subtree: true });
  scheduleEnhance();
})();

    <script>
/* Prevent one employee from having simultaneous open shifts at different locations. */
(function () {
  function openShiftFor(personId) {
    return state.shifts.find(shift => shift.personId === Number(personId) && !shift.exit) || null;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function conflictText(shift) {
    return `${shift.location || 'площадка не указана'} · ${shift.date || 'дата не указана'}, приход ${shift.entry || 'время не указано'}`;
  }

  function showConflictDialog(personId, shift = openShiftFor(personId)) {
    const employee = person(Number(personId));
    if (!employee || !shift) return;

    const modal = document.querySelector('#modal');
    modal.innerHTML = `<div class="modal-head">
      <div><h2>Смена уже открыта</h2><span class="demo-badge">${modeLabel()}</span></div>
      <button class="icon-btn" data-close-conflict aria-label="Закрыть">×</button>
    </div>
    <div class="shift-conflict-dialog">
      <span class="shift-conflict-icon">!</span>
      <div>
        <b>${escapeHtml(employee.name)} уже находится на смене</b>
        <p>Открытая площадка: <strong>${escapeHtml(shift.location || 'Не указана')}</strong></p>
        <small>${escapeHtml(shift.date || 'Дата не указана')} · приход ${escapeHtml(shift.entry || 'время не указано')}</small>
      </div>
    </div>
    <div class="shift-conflict-note">Сначала отметьте уход на площадке «${escapeHtml(shift.location || 'Не указана')}». Новая смена на «${escapeHtml(currentSecurityLocation)}» не создана.</div>
    <div class="modal-actions"><button class="btn primary" data-close-conflict>Понятно</button></div>`;
    modal.classList.remove('hidden');
    document.querySelector('#modal-backdrop').classList.remove('hidden');
    modal.querySelectorAll('[data-close-conflict]').forEach(button => { button.onclick = closeModal; });
  }

  window.showOpenShiftConflict = showConflictDialog;

  const quickOpenBeforeConflictCheck = quickOpenSecurityShift;
  quickOpenSecurityShift = function (personId) {
    const conflict = openShiftFor(personId);
    if (conflict) {
      showConflictDialog(personId, conflict);
      return false;
    }
    return quickOpenBeforeConflictCheck(personId);
  };

  const startShiftBeforeConflictCheck = startShiftModal;
  startShiftModal = function (selectedId = null) {
    const firstAvailable = state.people.find(employee => employee.securityVisible !== false && !openShiftFor(employee.id));
    startShiftBeforeConflictCheck(selectedId || firstAvailable?.id || null);

    const modal = document.querySelector('#modal');
    const select = modal.querySelector('[data-field="personId"]');
    const confirm = modal.querySelector('[data-confirm-modal]');
    if (!select || !confirm) return;

    const personField = select.closest('.field');
    const warning = document.createElement('div');
    warning.className = 'shift-conflict-inline full hidden';
    warning.setAttribute('role', 'alert');
    personField?.insertAdjacentElement('afterend', warning);

    const originalConfirm = confirm.onclick;
    const updateConflict = () => {
      const personId = Number(select.value);
      const conflict = openShiftFor(personId);
      confirm.disabled = Boolean(conflict);
      warning.classList.toggle('hidden', !conflict);
      warning.innerHTML = conflict
        ? `<span>!</span><div><b>Сотрудник уже открыт на другой площадке</b><small>${escapeHtml(conflictText(conflict))}</small><em>Сначала закройте текущую смену.</em></div>`
        : '';
      return conflict;
    };

    select.addEventListener('change', updateConflict);
    confirm.onclick = () => {
      const conflict = updateConflict();
      if (conflict) {
        showConflictDialog(Number(select.value), conflict);
        return;
      }
      originalConfirm();
    };
    updateConflict();
  };

  const securityPageBeforeConflictRows = securityPage;
  securityPage = function () {
    let html = securityPageBeforeConflictRows();
    const conflicts = [];
    const seen = new Set();
    state.shifts.forEach(shift => {
      if (shift.exit || shift.location === currentSecurityLocation || seen.has(shift.personId)) return;
      const employee = person(shift.personId);
      if (!employee || employee.securityVisible === false) return;
      seen.add(shift.personId);
      conflicts.push({ employee, shift });
    });
    if (!conflicts.length) return html;

    const rows = conflicts.map(({ employee, shift }) => `<div class="security-person-row is-open-elsewhere" data-person-card data-person-name="${escapeHtml(employee.name.toLowerCase())}">
      <span class="security-person-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21c0-4 2.7-7 7-7s7 3 7 7"/></svg></span>
      <button class="security-person-name" data-action="security-person-card" data-id="${employee.id}"><b>${escapeHtml(employee.name)}</b><small>${escapeHtml(employee.position || 'Должность не указана')} · на смене</small></button>
      <button class="security-quick-open conflict" data-action="quick-open-security-shift" data-id="${employee.id}" title="${escapeHtml(conflictText(shift))}">Открыт: ${escapeHtml(shift.location || 'другая точка')}</button>
    </div>`).join('');

    html = html.replace('<div class="security-mini-empty">Нет сотрудников без открытой смены</div>', '');
    return html.replace('</div><div class="security-quick-actions">', `${rows}</div><div class="security-quick-actions">`);
  };

  render();
})();

    <script>
/* Persistent employee register and workforce analytics for accounting and chef roles. */
(function () {
  const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const MONTHS_GENITIVE = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  function esc(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function isoDate(value) {
    const text = String(value || '');
    return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : ruToIso(text);
  }

  function monthKeyFromAdjustment(adjustment) {
    if (adjustment.date) return isoDate(adjustment.date).slice(0, 7);
    const match = String(adjustment.month || '').toLowerCase().match(/^([^\s]+)\s+(\d{4})$/);
    if (!match) return '';
    const index = Math.max(MONTHS.indexOf(match[1]), MONTHS_GENITIVE.indexOf(match[1]));
    return index < 0 ? '' : `${match[2]}-${String(index + 1).padStart(2, '0')}`;
  }

  function monthKeysBetween(from, to) {
    const keys = new Set();
    const cursor = new Date(`${from.slice(0, 7)}-01T12:00:00`);
    const end = new Date(`${to.slice(0, 7)}-01T12:00:00`);
    while (cursor <= end) {
      keys.add(`${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}`);
      cursor.setMonth(cursor.getMonth() + 1);
    }
    return keys;
  }

  const personWeekBeforePersistentRegister = personWeek;
  personWeek = function (personRecord, locationFilter = 'Все площадки') {
    const row = personWeekBeforePersistentRegister(personRecord, locationFilter);
    if (personRecord.source !== 'accounting' || row.shifts.length) return row;

    const inLocation = locationFilter === 'Все площадки' || personRecord.location === locationFilter;
    const manualAmount = Number(personRecord.manualAmount || 0);
    const fixedAmount = ['Оклад', 'Фиксированная сумма за неделю'].includes(personRecord.payType)
      ? Number(personRecord.rate || 0)
      : 0;
    const base = manualAmount > 0 ? manualAmount : fixedAmount;
    const total = base + Number(row.taxi || 0) + Number(row.bonus || 0) - Number(row.penalty || 0);
    return {
      ...row,
      ok: inLocation,
      base,
      total,
      balance: total - Number(row.paid || 0),
      salaryBase: base,
      salaryIncluded: true,
      salaryPayable: true,
      salaryUnderNorm: false,
      salaryMissingHours: 0,
      registerOnly: true
    };
  };

  const rowStatusBeforePersistentRegister = rowStatus;
  rowStatus = function (row) {
    if (row.errorShifts?.length) return status('Требует исправления', 'bad');
    if (row.registerOnly) return row.balance > 0 ? status('Без табеля · к выплате', 'good') : status('Без табеля охраны', 'warn');
    if (!row.shifts.length) return status('Нет смен в периоде', 'warn');
    return rowStatusBeforePersistentRegister(row);
  };

  const statementTableBeforePersistentRegister = statementTable;
  statementTable = function (rows) {
    const template = document.createElement('template');
    template.innerHTML = statementTableBeforePersistentRegister(rows);
    template.content.querySelectorAll('[data-ledger-row]').forEach((element, index) => {
      const row = rows[index];
      if (!row) return;
      if (!row.shifts.length) element.classList.add('ledger-no-activity');
      if (!row.ok) element.classList.add('ledger-has-error');
    });
    return template.innerHTML;
  };

  timesheetPage = function () {
    const allRows = weekRows();
    const entityRows = currentEntity === 'Все ООО'
      ? allRows
      : allRows.filter(row => row.p.legalEntity === currentEntity || row.shifts.some(shift => shift.legalEntity === currentEntity));
    const rows = currentEmployment === 'Все оформления'
      ? entityRows
      : entityRows.filter(row => employment(row.p) === currentEmployment);
    const needsOnboarding = row => !!window.needsPersonOnboarding?.(row.p);
    const ready = rows.filter(row => row.ok && !needsOnboarding(row));
    const errors = rows.filter(row => needsOnboarding(row) || (row.shifts.length && !row.ok));
    const total = ready.reduce((sum, row) => sum + row.total, 0);
    const balance = ready.reduce((sum, row) => sum + Math.max(0, row.balance), 0);
    const byType = type => ready.filter(row => employment(row.p) === type).reduce((sum, row) => sum + row.total, 0);
    const scope = currentLocation === 'Все площадки'
      ? (currentEntity === 'Все ООО' ? 'Все юрлица' : currentEntity)
      : `${currentLocation} · ${currentEntity}`;
    const overview = accountingOverview(ready, total, balance, errors, byType, scope)
      .replace(`<span>В расчёте</span><b>${ready.length}</b><small>сотрудников</small>`, `<span>Всего в базе</span><b>${rows.length}</b><small>${ready.length} в расчёте</small>`);

    return `<div class="page-title-row"><div>${kitchenBack()}<div class="eyebrow">Кухня · ${currentPeriod}</div><h1 class="page-title">Расчётная ведомость</h1></div><div class="actions"><button class="btn analytics-button" data-action="workforce-analytics" data-analytics-mode="accounting">Статистика персонала</button><button class="btn" data-action="accounting-person">+ Добавить сотрудника</button><button class="btn" data-action="export">⇩ Excel по месяцу</button><button class="btn primary" data-action="open-registers">Сформировать выплату</button></div></div>${weekFilters()}${overview}<div class="panel ledger-panel"><div class="ledger-toolbar"><div class="view-tabs"><button class="view-tab ${currentView === 'statement' ? 'active' : ''}" data-view="statement">Все сотрудники <span class="soft-count">${rows.length}</span></button><button class="view-tab ${currentView === 'attention' ? 'active' : ''}" data-view="attention">Требуют исправления <span class="count">${errors.length}</span></button><button class="view-tab ${currentView === 'registers' ? 'active' : ''}" data-view="registers">Реестры выплат <span class="soft-count">${state.registries.length}</span></button></div><button class="btn primary create-period-btn" data-action="create-payment-period">+ Период выплаты</button></div>${currentView === 'attention' ? errorsTable(errors) : currentView === 'registers' ? registryTable() : statementTable(rows)}<div class="panel-foot"><span>${currentView === 'statement' ? 'В реестре показаны все сотрудники базы; суммы относятся к выбранному периоду' : `Период: ${currentPeriod}`} · ${modeLabel(true)}</span></div></div>`;
  };

  const openAccountingPersonBeforeRegister = openAccountingPersonModal;
  openAccountingPersonModal = function () {
    openAccountingPersonBeforeRegister();
    const modal = document.querySelector('#modal');
    modal.classList.add('accounting-person-modal');
    const confirm = modal.querySelector('[data-confirm-modal]');
    if (confirm) confirm.textContent = 'Добавить в базу';
    const hint = modal.querySelector('.rate-hint');
    if (hint) hint.textContent = 'Сотрудник появится в общем реестре во всех периодах. Для сотрудника без табеля укажите оклад/фиксированную ставку или начисление вручную.';
    const payType = modal.querySelector('[data-field="payType"]');
    const hoursField = modal.querySelector('[data-field="hours"]')?.closest('.field');
    const rateField = modal.querySelector('[data-field="rate"]')?.closest('.field');
    const update = () => {
      if (!payType) return;
      const hourly = payType.value === 'Почасовая';
      hoursField?.classList.toggle('hidden', !hourly);
      if (rateField?.firstChild) rateField.firstChild.nodeValue = hourly ? 'Ставка за час' : payType.value === 'Оклад' ? 'Оклад за период' : 'Фиксированная сумма';
    };
    payType?.addEventListener('change', update);
    update();
  };

  const chefPageBeforeAnalytics = chefPage;
  chefPage = function () {
    const template = document.createElement('template');
    template.innerHTML = chefPageBeforeAnalytics();
    const titleRow = template.content.querySelector('.page-title-row');
    if (titleRow) {
      const actions = document.createElement('div');
      actions.className = 'actions chef-analytics-actions';
      actions.innerHTML = `<span>Объект: <b>${esc(currentSecurityLocation)}</b></span><button class="btn analytics-button" data-action="workforce-analytics" data-analytics-mode="chef">Статистика объекта</button>`;
      titleRow.append(actions);
    }
    return template.innerHTML;
  };

  function analyticsData(filters, mode) {
    const from = filters.from;
    const to = filters.to;
    const monthKeys = monthKeysBetween(from, to);
    const location = mode === 'chef' ? currentSecurityLocation : filters.location;
    const query = filters.query.trim().toLocaleLowerCase('ru-RU');
    const people = state.people.filter(employee => {
      if (filters.employment !== 'Все оформления' && employment(employee) !== filters.employment) return false;
      if (query && !employee.name.toLocaleLowerCase('ru-RU').includes(query)) return false;
      if (mode === 'accounting' && filters.entity !== 'Все ООО' && employee.legalEntity !== filters.entity && !state.shifts.some(shift => shift.personId === employee.id && shift.legalEntity === filters.entity)) return false;
      if (location !== 'Все площадки' && employee.location !== location && !state.shifts.some(shift => shift.personId === employee.id && shift.location === location)) return false;
      return true;
    });
    const personIds = new Set(people.map(employee => employee.id));
    const shifts = state.shifts.filter(shift => {
      const date = isoDate(shift.date);
      if (!personIds.has(shift.personId) || date < from || date > to) return false;
      if (location !== 'Все площадки' && shift.location !== location) return false;
      if (mode === 'accounting' && filters.entity !== 'Все ООО' && shift.legalEntity !== filters.entity) return false;
      return true;
    });
    const workedIds = new Set(shifts.map(shift => shift.personId));
    const adjustments = state.adjustments.filter(item => {
      if (!personIds.has(item.personId) || !monthKeys.has(monthKeyFromAdjustment(item))) return false;
      if (item.date) {
        const date = isoDate(item.date);
        if (date < from || date > to) return false;
      }
      if (location !== 'Все площадки' && item.location !== location) return false;
      return true;
    });

    const employeeRows = people.map(employee => {
      const ownShifts = shifts.filter(shift => shift.personId === employee.id);
      const workByShifts = ownShifts.reduce((sum, shift) => sum + Number(accrued(shift) || 0), 0);
      const manualWork = employee.source === 'accounting' && !ownShifts.length
        ? Number(employee.manualAmount || 0) || (['Оклад', 'Фиксированная сумма за неделю'].includes(employee.payType) ? Number(employee.rate || 0) : 0)
        : 0;
      const ownAdjustments = adjustments.filter(item => item.personId === employee.id);
      const bonus = ownAdjustments.filter(item => ['Премия', 'Анимация'].includes(item.type)).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const penalty = ownAdjustments.filter(item => item.type === 'Штраф').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const taxi = ownShifts.reduce((sum, shift) => sum + Number(shift.taxi || 0), 0);
      const work = workByShifts + manualWork;
      return {
        employee,
        shifts: ownShifts.length,
        days: new Set(ownShifts.map(shift => isoDate(shift.date))).size,
        hours: ownShifts.reduce((sum, shift) => sum + Number(hours(shift) || 0), 0),
        work,
        taxi,
        bonus,
        penalty,
        total: work + taxi + bonus - penalty,
        locations: [...new Set(ownShifts.map(shift => shift.location).filter(Boolean))]
      };
    });

    const dailyMap = new Map();
    shifts.forEach(shift => {
      const date = isoDate(shift.date);
      if (!dailyMap.has(date)) dailyMap.set(date, { date, people: new Set(), shifts: 0, hours: 0, work: 0, taxi: 0, penalty: 0 });
      const day = dailyMap.get(date);
      day.people.add(shift.personId);
      day.shifts += 1;
      day.hours += Number(hours(shift) || 0);
      day.work += Number(accrued(shift) || 0);
      day.taxi += Number(shift.taxi || 0);
    });
    adjustments.filter(item => item.type === 'Штраф' && item.date).forEach(item => {
      const date = isoDate(item.date);
      if (!dailyMap.has(date)) dailyMap.set(date, { date, people: new Set([item.personId]), shifts: 0, hours: 0, work: 0, taxi: 0, penalty: 0 });
      dailyMap.get(date).penalty += Number(item.amount || 0);
    });

    return {
      people,
      shifts,
      workedIds,
      employeeRows,
      dailyRows: [...dailyMap.values()].sort((a, b) => a.date.localeCompare(b.date)),
      totals: employeeRows.reduce((result, row) => {
        result.hours += row.hours;
        result.work += row.work;
        result.taxi += row.taxi;
        result.bonus += row.bonus;
        result.penalty += row.penalty;
        result.total += row.total;
        return result;
      }, { hours: 0, work: 0, taxi: 0, bonus: 0, penalty: 0, total: 0 })
    };
  }

  function openAnalytics(mode = 'accounting', incoming = {}) {
    const filters = {
      from: incoming.from || currentPeriodFrom,
      to: incoming.to || currentPeriodTo,
      location: mode === 'chef' ? currentSecurityLocation : (incoming.location || 'Все площадки'),
      entity: incoming.entity || 'Все ООО',
      employment: incoming.employment || 'Все оформления',
      query: incoming.query || ''
    };
    const data = analyticsData(filters, mode);
    const modal = document.querySelector('#modal');
    const locations = ['Все площадки', ...Object.keys(LOCATIONS)];
    const entities = ['Все ООО', ...new Set(Object.values(LOCATIONS).flatMap(item => item.entities || []))];
    const optionList = (items, selected) => items.map(item => `<option ${item === selected ? 'selected' : ''}>${esc(item)}</option>`).join('');
    const dailyRows = data.dailyRows.map(day => `<tr><td><b>${isoToRu(day.date)}</b></td><td>${day.people.size}</td><td>${day.shifts}</td><td>${day.hours.toLocaleString('ru-RU')} ч</td><td>${money(day.work)}</td><td>${money(day.taxi)}</td><td>${day.penalty ? `−${money(day.penalty)}` : '—'}</td><td><b>${money(day.work + day.taxi - day.penalty)}</b></td></tr>`).join('');
    const employeeRows = data.employeeRows.map(row => `<tr class="${row.shifts ? '' : 'analytics-no-shifts'}"><td><b>${esc(row.employee.name)}</b><small>${esc(row.employee.position || '—')} · ${esc(employment(row.employee))}${row.employee.source === 'accounting' ? ' · без табеля' : ''}</small></td><td>${esc(row.locations.join(', ') || row.employee.location || '—')}</td><td>${row.days}</td><td>${row.shifts}</td><td>${row.hours.toLocaleString('ru-RU')} ч</td><td>${money(row.work)}</td><td>${row.taxi ? `+${money(row.taxi)}` : '—'}</td><td>${row.bonus ? `+${money(row.bonus)}` : '—'}</td><td>${row.penalty ? `−${money(row.penalty)}` : '—'}</td><td><b>${money(row.total)}</b></td></tr>`).join('');

    modal.className = 'modal workforce-analytics-modal';
    modal.innerHTML = `<div class="modal-head"><div><h2>${mode === 'chef' ? 'Статистика объекта' : 'Статистика персонала'}</h2><div class="muted">${mode === 'chef' ? `Только объект «${esc(currentSecurityLocation)}»` : 'Все сотрудники и площадки с фильтрами'}</div></div><button class="icon-btn" data-close-analytics>×</button></div>
      <div class="analytics-filters">
        <label>Начало периода<input data-analytics-filter="from" type="date" value="${filters.from}"></label>
        <label>Конец периода<input data-analytics-filter="to" type="date" value="${filters.to}"></label>
        ${mode === 'accounting' ? `<label>Площадка<select data-analytics-filter="location">${optionList(locations, filters.location)}</select></label><label>Юрлицо<select data-analytics-filter="entity">${optionList(entities, filters.entity)}</select></label>` : `<label>Площадка<input value="${esc(currentSecurityLocation)}" disabled></label>`}
        <label>Оформление<select data-analytics-filter="employment">${optionList(['Все оформления', 'ТК', 'СЗ', 'Наличные'], filters.employment)}</select></label>
        <label class="analytics-search">Сотрудник<input data-analytics-filter="query" value="${esc(filters.query)}" placeholder="ФИО"></label>
        <button class="btn primary" data-apply-analytics>Применить</button>
      </div>
      <div class="analytics-metrics">
        <div><span>В базе</span><b>${data.people.length}</b><small>по фильтрам</small></div>
        <div><span>Работали</span><b>${data.workedIds.size}</b><small>уникальных сотрудников</small></div>
        <div><span>Смены</span><b>${data.shifts.length}</b><small>за период</small></div>
        <div><span>Часы</span><b>${data.totals.hours.toLocaleString('ru-RU')}</b><small>отработано</small></div>
        <div><span>Начислено</span><b>${money(data.totals.work)}</b><small>труд</small></div>
        <div><span>Итого</span><b>${money(data.totals.total)}</b><small>с корректировками</small></div>
      </div>
      <section class="analytics-section"><div class="analytics-section-head"><div><h3>По дням</h3><p>Количество людей, смены, часы и суммы за каждый день.</p></div></div><div class="table-wrap"><table class="data-table analytics-table"><thead><tr><th>Дата</th><th>Людей</th><th>Смен</th><th>Часы</th><th>Труд</th><th>Такси</th><th>Штрафы</th><th>Итого дня</th></tr></thead><tbody>${dailyRows || '<tr><td colspan="8" class="analytics-empty">За период смен нет</td></tr>'}</tbody></table></div></section>
      <section class="analytics-section"><div class="analytics-section-head"><div><h3>По сотрудникам</h3><p>Включая сотрудников бухгалтерии без табеля охраны.</p></div><div class="analytics-corrections"><span>Такси ${money(data.totals.taxi)}</span><span>Премии и анимации ${money(data.totals.bonus)}</span><span>Штрафы ${money(data.totals.penalty)}</span></div></div><div class="table-wrap"><table class="data-table analytics-table employee"><thead><tr><th>Сотрудник</th><th>Площадки</th><th>Дней</th><th>Смен</th><th>Часы</th><th>Труд</th><th>Такси</th><th>Премии</th><th>Штрафы</th><th>Итого</th></tr></thead><tbody>${employeeRows || '<tr><td colspan="10" class="analytics-empty">Сотрудники не найдены</td></tr>'}</tbody></table></div></section>
      <div class="analytics-footnote">Премии и анимации без конкретной даты включены в итог сотрудника за соответствующий месяц и не распределяются по дням.</div>
      <div class="modal-actions"><button class="btn primary" data-close-analytics>Закрыть</button></div>`;
    document.querySelector('#modal-backdrop').classList.remove('hidden');
    modal.querySelectorAll('[data-close-analytics]').forEach(button => { button.onclick = closeModal; });
    modal.querySelector('[data-apply-analytics]').onclick = () => {
      const values = {};
      modal.querySelectorAll('[data-analytics-filter]').forEach(input => { values[input.dataset.analyticsFilter] = input.value; });
      if (!values.from || !values.to || values.from > values.to) {
        toast('Проверьте даты периода');
        return;
      }
      openAnalytics(mode, values);
    };
  }

  const actionHandlerBeforeAnalytics = actionHandler;
  actionHandler = function (action, element) {
    if (action === 'workforce-analytics') {
      openAnalytics(element.dataset.analyticsMode || 'accounting');
      return;
    }
    return actionHandlerBeforeAnalytics(action, element);
  };

  window.openWorkforceAnalytics = openAnalytics;
  render();
})();

    </script>
    <script>
(function () {
  const ONBOARDING_STEPS = new Set(['position', 'employment', 'tk-settings']);

  function personStep(employee) {
    if (!employee) return '';
    if (['rate', 'position', 'employment', 'tk-settings'].includes(employee.onboardingStep)) return employee.onboardingStep;
    const legacyPending = employee.source === 'security' && employee.registeredAtLocation && !employee.rateConfirmed && !(Number(employee.rate) > 0);
    return employee.needsAccountingReview || legacyPending ? 'rate' : '';
  }

  function needsPersonOnboarding(employee) {
    return !!personStep(employee);
  }

  window.needsPersonOnboarding = needsPersonOnboarding;

  const weekRowsBeforePersonOnboarding = weekRows;
  weekRows = function () {
    const rows = weekRowsBeforePersonOnboarding();
    const existing = new Set(rows.map(row => row.p.id));
    state.people.forEach(employee => {
      const inLocation = currentLocation === 'Все площадки' || employee.registeredAtLocation === currentLocation || employee.location === currentLocation;
      if (needsPersonOnboarding(employee) && inLocation && !existing.has(employee.id)) rows.push(personWeek(employee, currentLocation));
    });
    return rows;
  };

  function stepOf(shift) {
    if (ONBOARDING_STEPS.has(shift.onboardingStep)) return shift.onboardingStep;
    if (shift.exit && (!rateOf(shift) || shift.rateReview)) return 'rate';
    return '';
  }

  function employeeForShift(shift) {
    return person(shift.personId);
  }

  function markPending(shift, step) {
    shift.onboardingStep = step;
    shift.status = 'Требует оформления сотрудника';
  }

  function markPersonPending(employee, step) {
    employee.needsAccountingReview = true;
    employee.onboardingStep = step;
  }

  function readyStatus(shift) {
    if (shift.paid != null) return shift.type === 'Вызывной' ? 'Закрыт подотчётом' : 'Проверено';
    return 'Готово';
  }

  function finishSimpleOnboarding(shift, engagement) {
    const employee = employeeForShift(shift);
    const confirmedRate = rateOf(shift);
    const pendingShifts = state.shifts.filter(candidate => candidate.personId === employee.id && candidate.position === shift.position && (candidate.rateReview || ONBOARDING_STEPS.has(candidate.onboardingStep)));
    shift.engagement = engagement;
    employee.engagement = engagement;
    confirmEmployeeRate(shift, confirmedRate);

    pendingShifts.forEach(candidate => {
      candidate.rate = confirmedRate;
      candidate.rateReview = false;
      candidate.engagement = engagement;
      delete candidate.onboardingStep;
      if (candidate.exit) candidate.status = readyStatus(candidate);
    });
    delete shift.onboardingStep;
    shift.status = readyStatus(shift);
    state.audit.unshift({
      at: new Date().toLocaleString('ru-RU'),
      actor: 'Бухгалтер',
      text: `${employee.name}: оформление завершено · ${shift.position} · ${engagement} · ставка ${money(confirmedRate)}/ч`
    });
  }

  function finishTkOnboarding(shift) {
    const employee = employeeForShift(shift);
    const fallbackRate = rateOf(shift);
    employee.engagement = 'ТК';
    employee.rateConfirmed = true;
    employee.ratePosition = shift.position;
    employee.rateConfirmedAt = new Date().toLocaleString('ru-RU');
    employee.rateConfirmedBy = 'Бухгалтер';

    state.shifts.forEach(candidate => {
      if (candidate.personId !== employee.id || candidate.position !== shift.position) return;
      if (candidate.rateReview || ONBOARDING_STEPS.has(candidate.onboardingStep)) {
        if (!rateOf(candidate)) candidate.rate = fallbackRate;
        candidate.rateReview = false;
        candidate.engagement = 'ТК';
        delete candidate.onboardingStep;
        if (candidate.exit) candidate.status = readyStatus(candidate);
      }
    });
    shift.engagement = 'ТК';
    delete shift.onboardingStep;
    shift.status = readyStatus(shift);
    state.audit.unshift({
      at: new Date().toLocaleString('ru-RU'),
      actor: 'Бухгалтер',
      text: `${employee.name}: оформление ТК завершено · ${shift.position}`
    });
  }

  function finishPersonSimpleOnboarding(employee, engagement) {
    const confirmedRate = Number(employee.rate);
    employee.engagement = engagement;
    employee.rateConfirmed = true;
    employee.ratePosition = employee.position;
    employee.rateConfirmedAt = new Date().toLocaleString('ru-RU');
    employee.rateConfirmedBy = 'Бухгалтер';
    employee.needsAccountingReview = false;
    delete employee.onboardingStep;
    state.shifts.forEach(shift => {
      if (shift.personId !== employee.id || shift.position !== employee.position || !shift.rateReview) return;
      shift.rate = confirmedRate;
      shift.rateReview = false;
      shift.engagement = engagement;
      if (shift.exit) shift.status = readyStatus(shift);
    });
    state.audit.unshift({
      at: new Date().toLocaleString('ru-RU'),
      actor: 'Бухгалтер',
      text: `${employee.name}: карточка нового сотрудника подтверждена · ${employee.position} · ${engagement} · ставка ${money(confirmedRate)}/ч`
    });
  }

  function finishPersonTkOnboarding(employee, pendingShiftIds) {
    employee.engagement = 'ТК';
    employee.rateConfirmed = true;
    employee.ratePosition = employee.position;
    employee.rateConfirmedAt = new Date().toLocaleString('ru-RU');
    employee.rateConfirmedBy = 'Бухгалтер';
    employee.needsAccountingReview = false;
    delete employee.onboardingStep;
    state.shifts.forEach(shift => {
      if (!pendingShiftIds.includes(shift.id)) return;
      if (!rateOf(shift)) shift.rate = Number(employee.rate || 0);
      shift.rateReview = false;
      shift.engagement = 'ТК';
      if (shift.exit) shift.status = readyStatus(shift);
    });
    state.audit.unshift({
      at: new Date().toLocaleString('ru-RU'),
      actor: 'Бухгалтер',
      text: `${employee.name}: карточка нового сотрудника подтверждена по ТК · ${employee.position}`
    });
  }

  function openTkOnboarding(shift) {
    const employee = employeeForShift(shift);
    employee.engagement = 'ТК';
    shift.engagement = 'ТК';
    markPending(shift, 'tk-settings');
    save();
    render();

    if (typeof window.openSalarySettings !== 'function') {
      toast('Не удалось открыть настройки ТК');
      return;
    }

    window.openSalarySettings(employee, () => finishTkOnboarding(shift));
    const modal = document.querySelector('#modal');
    const title = modal.querySelector('.modal-head h2');
    if (title) title.textContent = 'Условия оформления по ТК';
    const engagementSelect = modal.querySelector('[data-field="engagement"]');
    if (engagementSelect) {
      engagementSelect.value = 'ТК';
      engagementSelect.disabled = true;
      engagementSelect.closest('.field')?.classList.add('onboarding-locked-field');
    }
    modal.querySelector('.form-grid')?.insertAdjacentHTML(
      'afterbegin',
      '<div class="onboarding-modal-note full"><b>Последний шаг</b><span>Выберите тип оплаты и период действия условий. После сохранения сотрудник станет доступен для расчёта.</span></div>'
    );
  }

  function decorateTkModal() {
    const modal = document.querySelector('#modal');
    const title = modal.querySelector('.modal-head h2');
    if (title) title.textContent = 'Условия оформления по ТК';
    const engagementSelect = modal.querySelector('[data-field="engagement"]');
    if (engagementSelect) {
      engagementSelect.value = 'ТК';
      engagementSelect.disabled = true;
      engagementSelect.closest('.field')?.classList.add('onboarding-locked-field');
    }
    modal.querySelector('.form-grid')?.insertAdjacentHTML(
      'afterbegin',
      '<div class="onboarding-modal-note full"><b>Последний шаг</b><span>Выберите тип оплаты и период действия условий. После сохранения сотрудник станет доступен для расчёта.</span></div>'
    );
  }

  function openPersonTkOnboarding(employee) {
    const pendingShiftIds = state.shifts
      .filter(shift => shift.personId === employee.id && shift.position === employee.position && (shift.rateReview || ONBOARDING_STEPS.has(shift.onboardingStep)))
      .map(shift => shift.id);
    employee.engagement = 'ТК';
    markPersonPending(employee, 'tk-settings');
    save();
    render();
    if (typeof window.openSalarySettings !== 'function') {
      toast('Не удалось открыть настройки ТК');
      return;
    }
    window.openSalarySettings(employee, () => finishPersonTkOnboarding(employee, pendingShiftIds));
    decorateTkModal();
  }

  function issueFor(shift) {
    const step = stepOf(shift);
    if (step === 'rate') return { problem: 'Новый сотрудник: ставка', tone: 'warn', required: 'Шаг 1 из 3 · подтвердить ставку', action: 'Открыть смену' };
    if (step === 'position') return { problem: 'Не подтверждена должность', tone: 'warn', required: 'Шаг 2 из 3 · выбрать должность', action: 'Открыть смену' };
    if (step === 'employment') return { problem: 'Не выбрано оформление', tone: 'warn', required: 'Шаг 3 из 3 · выбрать статус', action: 'Открыть смену' };
    if (step === 'tk-settings') return { problem: 'Не заполнены условия ТК', tone: 'warn', required: 'Сохранить настройки ТК', action: 'Открыть смену' };
    if (!shift.exit) return { problem: 'Не отмечен уход', tone: 'bad', required: 'Охране указать время ухода', action: 'Открыть смену' };
    if (String(shift.status).includes('Расхождение')) return { problem: shift.status, tone: 'bad', required: 'Сверить начисление и выплату', action: 'Проверить смену' };
    return { problem: 'Ожидает проверки', tone: 'warn', required: 'Проверить время и начисление', action: 'Проверить смену' };
  }

  function onboardingControl(shift) {
    const step = stepOf(shift);
    if (step === 'rate') {
      const suggestedRate = rateOf(shift) || baseRate(shift.position, shift.location) || '';
      return `<div class="inline-rate-editor onboarding-rate"><label><input type="number" min="1" step="1" value="${suggestedRate}" data-onboarding-rate="${shift.id}" placeholder="Ставка"><span>₽/ч</span></label><button class="btn small primary" data-action="onboarding-rate" data-id="${shift.id}">Подтвердить</button></div>`;
    }
    if (step === 'position') {
      const suggestedPosition = shift.position || employeeForShift(shift)?.position || KITCHEN_POSITIONS[0];
      return `<div class="onboarding-inline-control"><select data-onboarding-position="${shift.id}">${options(KITCHEN_POSITIONS, suggestedPosition)}</select><button class="btn small primary" data-action="onboarding-position" data-id="${shift.id}">Подтвердить</button></div>`;
    }
    if (step === 'employment') {
      return `<div class="onboarding-employment" role="group" aria-label="Статус оформления"><button class="btn small" data-action="onboarding-employment" data-id="${shift.id}" data-value="ТК">ТК</button><button class="btn small" data-action="onboarding-employment" data-id="${shift.id}" data-value="СЗ">СЗ</button><button class="btn small" data-action="onboarding-employment" data-id="${shift.id}" data-value="Наличные">Наличные</button></div>`;
    }
    if (step === 'tk-settings') {
      return `<button class="btn small primary onboarding-tk-button" data-action="open-tk-onboarding" data-id="${shift.id}">Настроить ТК</button>`;
    }
    return `<b>${money(rateOf(shift))}</b>`;
  }

  function personIssue(employee) {
    const step = personStep(employee);
    if (step === 'rate') return { problem: 'Новый сотрудник', required: 'Шаг 1 из 3 · указать ставку' };
    if (step === 'position') return { problem: 'Не подтверждена должность', required: 'Шаг 2 из 3 · выбрать должность' };
    if (step === 'employment') return { problem: 'Не выбрано оформление', required: 'Шаг 3 из 3 · выбрать статус' };
    return { problem: 'Не заполнены условия ТК', required: 'Сохранить настройки ТК' };
  }

  function personOnboardingControl(employee) {
    const step = personStep(employee);
    if (step === 'rate') {
      const suggestedRate = Number(employee.rate) || baseRate(employee.position, employee.registeredAtLocation || employee.location || currentSecurityLocation) || '';
      return `<div class="inline-rate-editor onboarding-rate"><label><input type="number" min="1" step="1" value="${suggestedRate}" data-person-onboarding-rate="${employee.id}" placeholder="Ставка"><span>₽/ч</span></label><button class="btn small primary" data-action="onboarding-person-rate" data-person-id="${employee.id}">Подтвердить</button></div>`;
    }
    if (step === 'position') {
      const suggestedPosition = employee.position || KITCHEN_POSITIONS[0];
      return `<div class="onboarding-inline-control"><select data-person-onboarding-position="${employee.id}">${options(KITCHEN_POSITIONS, suggestedPosition)}</select><button class="btn small primary" data-action="onboarding-person-position" data-person-id="${employee.id}">Подтвердить</button></div>`;
    }
    if (step === 'employment') {
      return `<div class="onboarding-employment" role="group" aria-label="Статус оформления"><button class="btn small" data-action="onboarding-person-employment" data-person-id="${employee.id}" data-value="ТК">ТК</button><button class="btn small" data-action="onboarding-person-employment" data-person-id="${employee.id}" data-value="СЗ">СЗ</button><button class="btn small" data-action="onboarding-person-employment" data-person-id="${employee.id}" data-value="Наличные">Наличные</button></div>`;
    }
    return `<button class="btn small primary onboarding-tk-button" data-action="open-person-tk-onboarding" data-person-id="${employee.id}">Настроить ТК</button>`;
  }

  function personOnboardingRow(employee) {
    const issue = personIssue(employee);
    const registeredAt = employee.registeredAt || 'Сегодня';
    return `<tr data-person-onboarding-row="${employee.id}" class="person-onboarding-row">
      <td><button class="person-link" data-person="${employee.id}">${employee.name}</button><div class="subline">${employee.position || 'Должность не указана'}</div></td>
      <td><b>${registeredAt}</b><div class="subline">Карточка создана охраной</div></td>
      <td>${employee.registeredAtLocation || '—'}</td>
      <td>—</td>
      <td>${status(issue.problem, 'warn')}</td>
      <td><b class="attention-required">${issue.required}</b></td>
      <td><b>—</b></td>
      <td class="onboarding-control-cell">${personOnboardingControl(employee)}</td>
      <td><button class="btn small" data-person="${employee.id}">Карточка</button></td>
    </tr>`;
  }

  const hasErrorBeforeOnboarding = hasError;
  hasError = function (shift) {
    return !!stepOf(shift) || hasErrorBeforeOnboarding(shift);
  };

  window.errorsTable = function (rows) {
    if (!rows.length) return empty('Ошибок нет', 'Все сотрудники с закрытыми и проверенными сменами доступны в расчёте.');

    return `<div class="table-wrap attention-table-wrap"><table class="data-table compact inline-rate-table attention-table onboarding-table">
      <thead><tr>
        <th>Сотрудник</th>
        <th>Дата и время</th>
        <th>Площадка</th>
        <th>ООО</th>
        <th>Проблема</th>
        <th>Что требуется</th>
        <th>Начислено</th>
        <th>Оформление сотрудника</th>
        <th></th>
      </tr></thead>
      <tbody>${rows.map(row => {
        const personPending = needsPersonOnboarding(row.p);
        const personRow = personPending ? personOnboardingRow(row.p) : '';
        const shiftRows = row.errorShifts.filter(shift => !personPending || !stepOf(shift)).map(shift => {
        const issue = issueFor(shift);
        const workTime = shift.workStart && shift.workEnd ? `${shift.workStart}–${shift.workEnd}` : `${shift.entry || '—'}–${shift.exit || '…'}`;
        return `<tr data-onboarding-row="${shift.id}">
          <td><button class="person-link" data-person="${row.p.id}">${row.p.name}</button><div class="subline">${shift.position}</div></td>
          <td><b>${shift.date}</b><div class="subline">${workTime}${hours(shift) == null ? '' : ` · ${hours(shift).toLocaleString('ru-RU')} ч`}</div></td>
          <td>${shift.location}</td>
          <td>${shift.legalEntity}</td>
          <td>${status(issue.problem, issue.tone)}</td>
          <td><b class="attention-required">${issue.required}</b></td>
          <td><b>${money(accrued(shift))}</b></td>
          <td class="onboarding-control-cell">${onboardingControl(shift)}</td>
          <td><button class="btn small" data-shift="${shift.id}">${issue.action}</button></td>
        </tr>`;
        }).join('');
        return personRow + shiftRows;
      }).join('')}</tbody>
    </table></div>`;
  };

  const bindActionBeforeOnboarding = window.bindAction;
  window.bindAction = function (element) {
    const action = element.dataset.action;
    const personActions = ['onboarding-person-rate', 'onboarding-person-position', 'onboarding-person-employment', 'open-person-tk-onboarding'];
    if (!['onboarding-rate', 'onboarding-position', 'onboarding-employment', 'open-tk-onboarding', ...personActions].includes(action)) {
      bindActionBeforeOnboarding(element);
      return;
    }

    element.onclick = () => {
      if (personActions.includes(action)) {
        const employee = person(Number(element.dataset.personId));
        if (!employee) return;
        if (action === 'onboarding-person-rate') {
          const input = document.querySelector(`[data-person-onboarding-rate="${employee.id}"]`);
          const rate = Number(input?.value);
          if (!(rate > 0)) { toast('Введите ставку больше нуля'); input?.focus(); return; }
          employee.rate = rate;
          employee.rateConfirmed = false;
          markPersonPending(employee, 'position');
          state.audit.unshift({ at: new Date().toLocaleString('ru-RU'), actor: 'Бухгалтер', text: `${employee.name}: ставка ${money(rate)}/ч подтверждена, ожидается выбор должности` });
          save(); render(); toast('Ставка подтверждена · выберите должность'); return;
        }
        if (action === 'onboarding-person-position') {
          const position = document.querySelector(`[data-person-onboarding-position="${employee.id}"]`)?.value;
          if (!position) { toast('Выберите должность'); return; }
          employee.position = position;
          markPersonPending(employee, 'employment');
          state.audit.unshift({ at: new Date().toLocaleString('ru-RU'), actor: 'Бухгалтер', text: `${employee.name}: подтверждена должность ${position}, ожидается выбор оформления` });
          save(); render(); toast('Должность подтверждена · выберите оформление'); return;
        }
        if (action === 'onboarding-person-employment') {
          const engagement = element.dataset.value;
          if (engagement === 'ТК') { openPersonTkOnboarding(employee); return; }
          finishPersonSimpleOnboarding(employee, engagement);
          save(); render(); toast(`Сотрудник оформлен: ${engagement}`); return;
        }
        openPersonTkOnboarding(employee);
        return;
      }

      const shift = state.shifts.find(item => item.id === Number(element.dataset.id));
      if (!shift) return;
      const employee = employeeForShift(shift);

      if (action === 'onboarding-rate') {
        const input = document.querySelector(`[data-onboarding-rate="${shift.id}"]`);
        const rate = Number(input?.value);
        if (!(rate > 0)) {
          toast('Введите ставку больше нуля');
          input?.focus();
          return;
        }
        shift.rate = rate;
        shift.rateReview = false;
        employee.rate = rate;
        employee.rateConfirmed = false;
        markPending(shift, 'position');
        state.audit.unshift({ at: new Date().toLocaleString('ru-RU'), actor: 'Бухгалтер', text: `${employee.name}: ставка ${money(rate)}/ч подтверждена, ожидается выбор должности` });
        save();
        render();
        toast('Ставка подтверждена · выберите должность');
        return;
      }

      if (action === 'onboarding-position') {
        const select = document.querySelector(`[data-onboarding-position="${shift.id}"]`);
        const position = select?.value;
        if (!position) {
          toast('Выберите должность');
          return;
        }
        shift.position = position;
        employee.position = position;
        markPending(shift, 'employment');
        state.audit.unshift({ at: new Date().toLocaleString('ru-RU'), actor: 'Бухгалтер', text: `${employee.name}: подтверждена должность ${position}, ожидается выбор оформления` });
        save();
        render();
        toast('Должность подтверждена · выберите оформление');
        return;
      }

      if (action === 'onboarding-employment') {
        const engagement = element.dataset.value;
        if (engagement === 'ТК') {
          openTkOnboarding(shift);
          return;
        }
        finishSimpleOnboarding(shift, engagement);
        save();
        render();
        toast(`Сотрудник оформлен: ${engagement}`);
        return;
      }

      openTkOnboarding(shift);
    };
  };

  render();
})();

    </script>
</body>
</html>
